  function telaAvisoAcesso(titulo, texto) {
    tela(`
      <div class="tela-login">
        <h1>${esc(titulo)}</h1>
        <p class="suave">${esc(texto)}</p>
        <button class="pr-btn pr-btn--pri largo" onclick="iniciar()">Verificar de novo</button>
        <button class="pr-btn pr-btn--texto" onclick="sairDoSistema()">Sair</button>
      </div>`, true);
  }

  /* =========================================================
   * Painel inicial
   * ========================================================= */
  /* =========================================================
   * Painel: abas "Resumo" (situação dos imóveis e valores do mês) e "Pagamentos" (cobranças e recebimentos)
   * ========================================================= */
  const NOMES_MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];

  function nomeDoMes(mes) {
    const [a, m] = mes.split('-').map(Number);
    return `${NOMES_MESES[m - 1]} de ${a}`;
  }

  /* ---------- Tela principal: só os cartões ---------- */
  // Cada cartão abre a tela da sua categoria (#/categoria/<id>), com o cartão no alto como cabeçalho.
  // tipo 'valor' = cobranças do mês (com Registrar pagamento); tipo 'imovel' = imóveis pela situação.
  const CATEGORIAS = {
    recebido: { tipo: 'valor', rotulo: 'Recebido', classe: 'ok', lista: p => p.recebidos, total: p => p.financeiro.recebido,
      detalhe: () => '<span class="suave pequeno">Pagamentos no período</span>', titulo: 'Pagamentos recebidos', vazio: 'Nenhum pagamento recebido no período.' },
    aVencer: { tipo: 'valor', rotulo: 'A vencer', classe: '', lista: p => p.aVencer, total: p => p.financeiro.aVencer,
      detalhe: () => '<span class="suave pequeno">Ainda vão chegar</span>', titulo: 'Aluguéis a vencer', vazio: 'Nenhum aluguel a vencer no período.' },
    vencido: { tipo: 'valor', rotulo: 'Vencido', classe: 'vencido', lista: p => p.vencidos, total: p => p.financeiro.vencido,
      detalhe: p => `<span class="st st--vencido">${p.vencidos.length} ${p.vencidos.length === 1 ? 'aluguel atrasado' : 'aluguéis atrasados'}</span>`,
      titulo: 'Aluguéis vencidos sem pagamento', vazio: 'Nenhum aluguel vencido no período. Tudo em dia!' },
    ocupados: { tipo: 'imovel', rotulo: 'Ocupados', classe: '', lista: p => p.imoveis.filter(i => i.situacao !== 'sem-prazo'),
      detalhe: () => '<span class="suave pequeno">Com inquilino</span>', titulo: 'Imóveis alugados', vazio: 'Nenhum imóvel alugado ainda.' },
    vagos: { tipo: 'imovel', rotulo: 'Vagos', classe: '', lista: p => p.imoveis.filter(i => i.situacao === 'sem-prazo'),
      detalhe: () => '<span class="st st--sem-prazo">Sem inquilino</span>', titulo: 'Imóveis vagos', vazio: 'Nenhum imóvel vago.' },
    emDia: { tipo: 'imovel', rotulo: 'Em dia', classe: 'ok', lista: p => p.imoveis.filter(i => i.situacao === 'ok' || i.situacao === 'aviso'),
      detalhe: p => p.totais.aviso ? `<span class="st st--aviso">${p.totais.aviso} ${p.totais.aviso === 1 ? 'vence' : 'vencem'} em até 3 dias</span>`
        : '<span class="st st--ok">Pagamentos em dia</span>', titulo: 'Imóveis com o pagamento em dia', vazio: 'Nenhum imóvel em dia agora.' },
    atrasados: { tipo: 'imovel', rotulo: 'Atrasados', classe: 'vencido', lista: p => p.imoveis.filter(i => i.situacao === 'vencido'),
      detalhe: () => '<span class="st st--vencido">Precisa de atenção</span>', titulo: 'Imóveis com aluguel atrasado', vazio: 'Nenhum imóvel atrasado. Tudo em dia!' }
  };

  // O número grande do cartão: dinheiro nos cartões de valor, quantidade nos de imóveis
  function numeroCategoria(id, p) {
    const c = CATEGORIAS[id];
    return c.tipo === 'valor' ? esc(dinheiro(c.total(p)) || 'R$ 0,00') : c.lista(p).length;
  }

  // Cartão do painel (link) ou cabeçalho da tela da categoria (sem link)
  function cartaoCategoria(id, p, periodo, cabecalho) {
    const c = CATEGORIAS[id];
    const miolo = `<span class="rotulo">${c.rotulo}</span><b>${numeroCategoria(id, p)}</b>${c.detalhe(p)}`;
    return cabecalho ? `<div class="total total--cabecalho ${c.classe}">${miolo}</div>`
      : `<a class="total ${c.classe}" href="#/categoria/${id}${sufixoPeriodo(periodo)}">${miolo}</a>`;
  }

  /* ---------- Período da tela principal ----------
   * Fica no endereço (#/?de=aaaa-mm-dd&ate=aaaa-mm-dd); sem ele, vale o mês atual.
   * Cada período tem a sua cópia (cache) "painel:de:ate"; o mês atual usa "painel". */
  const PERIODOS = [['mes', 'Este mês'], ['mesPassado', 'Mês passado'], ['tres', 'Últimos 3 meses'], ['ano', 'Este ano'], ['personalizado', 'Personalizado']];

  function periodoDaRota(busca) {
    const q = new URLSearchParams(busca || '');
    const de = q.get('de'), ate = q.get('ate');
    const ok = d => /^\d{4}-\d{2}-\d{2}$/.test(d || '');
    return ok(de) && ok(ate) && de <= ate ? { de, ate } : null;
  }

  function sufixoPeriodo(periodo) {
    return periodo ? `?de=${periodo.de}&ate=${periodo.ate}` : '';
  }

  function fimDoMes(mes) {
    const [a, m] = mes.split('-').map(Number);
    return new Date(Date.UTC(a, m, 0)).toISOString().slice(0, 10);
  }

  // Datas de um atalho ("mesPassado", "tres"...) a partir de hoje; "mes" = null (o padrão)
  function datasDoAtalho(id, hoje) {
    const [a, m] = hoje.split('-').map(Number);
    const mesAntes = n => new Date(Date.UTC(a, m - 1 - n, 1)).toISOString().slice(0, 7);
    if (id === 'mesPassado') return { de: mesAntes(1) + '-01', ate: fimDoMes(mesAntes(1)) };
    if (id === 'tres') return { de: mesAntes(2) + '-01', ate: fimDoMes(hoje.slice(0, 7)) };
    if (id === 'ano') return { de: a + '-01-01', ate: a + '-12-31' };
    return null;
  }

  function atalhoDoPeriodo(periodo, hoje) {
    if (!periodo) return 'mes';
    const igual = PERIODOS.find(([id]) => { const d = datasDoAtalho(id, hoje); return d && d.de === periodo.de && d.ate === periodo.ate; });
    return igual ? igual[0] : 'personalizado';
  }

  // "outubro de 2026", "2026" ou "01/08/2026 a 31/10/2026"
  function textoPeriodo(de, ate) {
    if (de.slice(8) === '01' && de.slice(0, 7) === ate.slice(0, 7) && ate === fimDoMes(ate.slice(0, 7))) return nomeDoMes(de.slice(0, 7));
    if (de.slice(5) === '01-01' && ate.slice(5) === '12-31' && de.slice(0, 4) === ate.slice(0, 4)) return de.slice(0, 4);
    return `${dataBR(de)} a ${dataBR(ate)}`;
  }

  function seletorPeriodo(periodo, p) {
    const atual = atalhoDoPeriodo(periodo, p.hoje);
    return `<div class="periodo" role="group" aria-label="Período">
      <div class="pr-field periodo-escolha"><label for="periodo" class="sr">Período</label>
        <select id="periodo" onchange="escolherPeriodo(this.value)">${PERIODOS.map(([id, nome]) =>
          `<option value="${id}"${id === atual ? ' selected' : ''}>${nome}</option>`).join('')}</select></div>
      <div class="periodo-datas" id="periodo-datas"${atual === 'personalizado' ? '' : ' hidden'}>
        <div class="pr-field"><label for="periodo-de">De</label><input id="periodo-de" type="date" value="${p.de}"></div>
        <div class="pr-field"><label for="periodo-ate">Até</label><input id="periodo-ate" type="date" value="${p.ate}"></div>
        <button type="button" class="pr-btn pr-btn--pri" onclick="aplicarPeriodo()">Aplicar</button>
      </div>
    </div>`;
  }

  function escolherPeriodo(id) {
    if (id === 'personalizado') {
      document.getElementById('periodo-datas').hidden = false;
      return document.getElementById('periodo-de').focus();
    }
    navegar('#/' + sufixoPeriodo(datasDoAtalho(id, estado.hojePainel || hojeISO())));
  }

  function aplicarPeriodo() {
    const de = document.getElementById('periodo-de').value, ate = document.getElementById('periodo-ate').value;
    if (!de || !ate) return mostrarMensagem('Escolha as duas datas do período.', 'erro');
    if (de > ate) return mostrarMensagem('A data "De" precisa ser antes da data "Até".', 'erro');
    navegar('#/' + sufixoPeriodo({ de, ate }));
  }

  function chavePainel(periodo) {
    return periodo ? `painel:${periodo.de}:${periodo.ate}` : 'painel';
  }

  function buscarPainel(periodo) {
    return () => periodo ? chamar('abrirPainel', auth(), periodo.de, periodo.ate) : chamar('abrirPainel', auth());
  }

  async function telaPainel(periodo) {
    try {
      await carregarTela(chavePainel(periodo), buscarPainel(periodo), (p, atualizacao) => desenharPainel(p, periodo, atualizacao));
    } catch (erro) { telaErro(erro, '#/' + sufixoPeriodo(periodo)); }
  }

  function textoSituacaoNaData(p) {
    return p.dataSituacao === p.hoje ? 'hoje' : 'em ' + dataBR(p.dataSituacao);
  }

  function desenharPainel(p, periodo, atualizacao) {
    if (paginaAtual() !== '') return; // a pessoa mudou de tela enquanto carregava
    if (p.avisos) estado.avisos = p.avisos;
    estado.hojePainel = p.hoje;
    desenharTopo('');
    tela(`<div class="painel-cheio tela-fixa">
      <h1 class="sr">Painel</h1>
      ${seletorPeriodo(periodo, p)}
      <section class="relatorio" aria-labelledby="titulo-relatorio">
        <h2 class="titulo-secao" id="titulo-relatorio">Aluguéis de ${esc(textoPeriodo(p.de, p.ate))}</h2>
        <div class="totais totais--valores">${['recebido', 'aVencer', 'vencido'].map(id => cartaoCategoria(id, p, periodo)).join('')}</div>
      </section>
      <section class="relatorio" aria-labelledby="titulo-situacao">
        <h2 class="titulo-secao" id="titulo-situacao">Situação dos imóveis ${esc(textoSituacaoNaData(p))}</h2>
        <div class="totais totais--imoveis">${['ocupados', 'vagos', 'emDia', 'atrasados'].map(id => cartaoCategoria(id, p, periodo)).join('')}</div>
      </section>
      ${p.imoveis.length || periodo ? '' : '<p class="vazio">Nenhum imóvel cadastrado ainda. <a href="#/novo">Incluir o primeiro imóvel</a></p>'}
      </div>`, false, atualizacao);
    ajustarTelaFixa();
  }

  // Telas sem rolagem da página (painel e telas com lista): o bloco .tela-fixa ocupa exatamente a altura que sobra
  // na tela (abaixo do topo e acima do menu de baixo do celular). No painel, os cartões dividem essa altura;
  // nas listas, só a lista (.crescer) rola por dentro. Em tela muito baixa (< 260 px livres), a página volta a rolar.
  function ajustarTelaFixa() {
    const el = document.querySelector('#tela .tela-fixa');
    if (!el) return;
    const main = document.getElementById('tela');
    const embaixo = parseFloat(getComputedStyle(main).paddingBottom) || 0;
    const livre = Math.floor(window.innerHeight - (el.getBoundingClientRect().top + window.scrollY) - embaixo) - 1;
    const painel = el.classList.contains('painel-cheio');
    // No painel do computador, no máximo 560 px: mais que isso só deixaria os cartões vazios
    el.style.height = livre >= 260 ? (painel ? Math.min(livre, window.innerWidth >= 1024 ? 560 : 760) : livre) + 'px' : '';
    el.classList.toggle('tela-fixa--rola', livre < 260);
    if (!painel) return;
    // Algum cartão não coube? Esconde os textos de apoio aos poucos, até caber
    el.classList.remove('painel-cheio--compacto', 'painel-cheio--minimo');
    const estoura = () => [...el.querySelectorAll('.total')].some(c => c.scrollHeight > c.clientHeight + 1);
    if (estoura()) el.classList.add('painel-cheio--compacto');
    if (estoura()) el.classList.add('painel-cheio--minimo');
  }

  window.addEventListener('resize', ajustarTelaFixa);

  /* ---------- Tela de uma categoria: o cartão no alto e a lista embaixo ---------- */
  async function telaCategoria(id, periodo) {
    try {
      await carregarTela(chavePainel(periodo), buscarPainel(periodo), (p, atualizacao) => desenharCategoria(id, p, periodo, atualizacao));
    } catch (erro) { telaErro(erro, '#/categoria/' + id + sufixoPeriodo(periodo)); }
  }

  function desenharCategoria(id, p, periodo, atualizacao) {
    if (location.hash.split('?')[0] !== '#/categoria/' + id) return;
    if (p.avisos) estado.avisos = p.avisos;
    desenharTopo('categoria');
    const c = CATEGORIAS[id];
    const lista = c.lista(p);
    // As linhas de cobrança se referem a estado.pagamentos pela posição (Registrar pagamento, Ver comprovante…)
    if (c.tipo === 'valor') estado.pagamentos = { visiveis: lista };
    const quando = c.tipo === 'valor' ? ' · ' + textoPeriodo(p.de, p.ate) : ' ' + textoSituacaoNaData(p);
    tela(`<div class="tela-fixa">
      <a class="pr-btn pr-btn--texto pr-btn--pequeno voltar" href="#/${sufixoPeriodo(periodo)}">‹ Voltar ao painel</a>
      <h1 class="sr">${esc(c.rotulo)}</h1>
      <div class="cabecalho-categoria">${cartaoCategoria(id, p, periodo, true)}</div>
      <section class="painel crescer" aria-labelledby="titulo-categoria">
        <div class="painel-topo"><h2 id="titulo-categoria">${esc(c.titulo + quando)}
          <span class="rotulo">${lista.length}</span></h2></div>
        ${!lista.length ? `<p class="vazio">${c.vazio}</p>`
          : c.tipo === 'valor' ? `<div class="lista-cobrancas rolagem">${lista.map((x, n) => linhaCobranca(x, 'visiveis', n)).join('')}</div>`
          : tabelaImoveisCategoria(lista)}
      </section></div>`, false, atualizacao);
  }

  // Imóveis de uma categoria: tabela no computador e cards no celular, sempre com "Editar"
  function tabelaImoveisCategoria(lista) {
    return `<div class="caixa-tabela">
        <table class="tabela tabela--painel">
          <thead><tr><th>Imóvel</th><th>Valor</th><th>Vencimento</th><th>Situação</th><th><span class="sr">Ações</span></th></tr></thead>
          <tbody>${lista.map(i => `
            <tr class="clicavel" onclick="if (!event.target.closest('a')) navegar('#/imovel/${esc(i.ID_Imovel)}')">
              <td><div class="com-capa">${avatarImovel(i.Nome, i.Capa)}<div><div class="nome">${esc(i.Nome)}</div>
                <div class="suave pequeno">${esc(i.Inquilino || 'Sem inquilino')}</div></div></div></td>
              <td class="data">${esc(dinheiro(i.ValorAluguel) || '—')}</td>
              <td class="data">${i.proximoVencimento ? `<b>${dataBR(i.proximoVencimento)}</b><div class="suave pequeno">${esc(textoCobranca(i))}</div>` : '<span class="suave">—</span>'}</td>
              <td>${etiquetaSituacao(i)}</td>
              <td><a class="pr-btn pr-btn--texto pr-btn--pequeno" href="#/imovel/${esc(i.ID_Imovel)}" aria-label="Editar ${esc(i.Nome)}">${ICONE.lapis}Editar</a></td>
            </tr>`).join('')}</tbody>
        </table>
      </div>
      <div class="lista-cartoes rolagem">${lista.map(i => `
        <a class="cartao-imovel" href="#/imovel/${esc(i.ID_Imovel)}">
          <div class="linha"><div class="com-capa">${avatarImovel(i.Nome, i.Capa)}<b>${esc(i.Nome)}</b></div>${etiquetaSituacao(i)}</div>
          <span class="pequeno">${i.Cobrar ? `${esc(i.Inquilino || 'Sem inquilino')} · vence <b class="mono">${dataBR(i.proximoVencimento)}</b>${i.ValorAluguel !== '' ? ' · ' + esc(dinheiro(i.ValorAluguel)) : ''}` : 'Vago'}</span>
          <span class="editar-cartao">${ICONE.lapis}Editar</span>
        </a>`).join('')}</div>`;
  }

  function situacaoCobranca(c) {
    if (c.situacao === 'pago') return `<span class="st st--ok">Pago em ${dataBR(c.pagamento.DataPagamento).slice(0, 5)}</span>`;
    if (c.situacao === 'atrasado') return `<span class="st st--vencido">Atrasado há ${c.diasAtraso} ${c.diasAtraso === 1 ? 'dia' : 'dias'}</span>`;
    return '<span class="st st--sem-prazo">A vencer</span>';
  }

  function linhaCobranca(c, lista, n) {
    const [, m, d] = c.data.split('-');
    const ref = `'${lista}', ${n}`;
    const pago = c.pagamento;
    const diferente = pago && Math.abs(pago.Valor - c.valor) > 0.009
      ? ` <span class="suave pequeno">(recebido ${esc(dinheiro(pago.Valor))})</span>` : '';
    return `<div class="cobranca">
      <div class="pr-card__dia"><b>${d}</b><span>${MESES[Number(m) - 1]}</span></div>
      <a class="com-capa cobranca-imovel" href="#/imovel/${esc(c.ID_Imovel)}">${avatarImovel(c.Nome, c.Capa)}
        <div><b>${esc(c.Nome)}</b><div class="suave pequeno">${esc(c.Inquilino || 'Sem inquilino')}</div></div></a>
      <div class="cobranca-valor"><span class="valor-aluguel">${esc(dinheiro(c.valor) || 'Sem valor')}</span>${diferente}<div>${situacaoCobranca(c)}</div></div>
      <div class="acoes cobranca-acoes">
        ${pago ? `
          ${pago.ComprovanteUrl
            ? `<button type="button" class="pr-btn pr-btn--sec pr-btn--pequeno" onclick="verComprovante(${ref})">Ver comprovante</button>`
            : `<button type="button" class="pr-btn pr-btn--sec pr-btn--pequeno" onclick="abrirComprovante(${ref})">Anexar comprovante</button>`}
          <button type="button" class="pr-btn pr-btn--texto pr-btn--pequeno" onclick="desfazerPagamentoTela(${ref})">Desfazer</button>`
        : `<button type="button" class="pr-btn pr-btn--pri pr-btn--pequeno" onclick="abrirRegistroPagamento(${ref})">Registrar pagamento</button>`}
      </div>
    </div>`;
  }

  function cobrancaDaTela(lista, n) {
    return estado.pagamentos && estado.pagamentos[lista] && estado.pagamentos[lista][n];
  }

  function recarregarPagamentos() {
    irPara(location.hash);
  }

  // Campo de comprovante (foto ou PDF; HEIC vira JPG), usado no registro e no "Anexar comprovante"
  function campoComprovante() {
    return `<div class="pr-field"><span style="font:600 14px/20px var(--font-sans)">Comprovante (opcional)</span>
      <label class="area-envio area-envio--pequena" for="campo-comprovante">${ICONE.arquivo}Escolher foto ou PDF<span id="nome-comprovante">Pix, recibo, extrato…</span></label>
      <input id="campo-comprovante" type="file" accept="image/*,.heic,.heif,application/pdf" class="sr" onchange="escolherComprovante(this)"></div>`;
  }

  async function escolherComprovante(campo) {
    let arquivo = campo.files[0];
    campo.value = '';
    estado.comprovante = null;
    if (!arquivo) return;
    const pdf = arquivo.type === 'application/pdf';
    if (!pdf && !ehHeic(arquivo) && !arquivo.type.startsWith('image/')) return mostrarMensagem('O comprovante precisa ser uma foto ou um PDF.', 'erro');
    if (ehHeic(arquivo)) {
      document.getElementById('nome-comprovante').textContent = 'Convertendo para JPG…';
      try { arquivo = await converterHeic(arquivo, arquivo.name); } catch (e) { return mostrarMensagem('Não deu para converter a foto. Tente em JPG.', 'erro'); }
    }
    estado.comprovante = arquivo;
    document.getElementById('nome-comprovante').textContent = nomeLegivel(arquivo.name);
  }

  function abrirRegistroPagamento(lista, n) {
    const c = cobrancaDaTela(lista, n);
    if (!c) return;
    estado.comprovante = null;
    const hoje = hojeISO();
    abrirJanela('Registrar pagamento', `
      <div class="com-capa">${avatarImovel(c.Nome, c.Capa)}<div><b>${esc(c.Nome)}</b>
        <div class="suave pequeno">Cobrança de ${dataBR(c.data)} · ${esc(dinheiro(c.valor) || 'sem valor cadastrado')}</div></div></div>
      <div class="grade">
        <div class="pr-field"><label for="pg-data">Data do pagamento</label>
          <input id="pg-data" type="date" value="${hoje}" max="${hoje}"></div>
        <div class="pr-field"><label for="pg-valor">Valor recebido</label>
          <input id="pg-valor" inputmode="decimal" autocomplete="off" placeholder="R$ 0,00" onblur="formatarValor(this)"
            value="${c.valor ? esc(Number(c.valor).toLocaleString('pt-BR', { minimumFractionDigits: 2 })) : ''}"></div>
      </div>
      ${campoComprovante()}
      <div class="pr-field"><label for="pg-obs">Observação (opcional)</label>
        <input id="pg-obs" maxlength="500" placeholder="Ex.: Pix, pagou em dinheiro, pagamento parcial…"></div>`, '',
      `<button type="button" class="pr-btn pr-btn--sec" onclick="fecharJanela()">Cancelar</button>
       <button type="button" class="pr-btn pr-btn--pri" id="btn-salvar-pagamento" onclick="salvarPagamento('${lista}', ${n})">Salvar pagamento</button>`);
  }

  async function salvarPagamento(lista, n) {
    const c = cobrancaDaTela(lista, n);
    const dados = {
      DataPagamento: document.getElementById('pg-data').value,
      Valor: document.getElementById('pg-valor').value.trim(),
      Observacao: document.getElementById('pg-obs').value.trim()
    };
    if (!dados.DataPagamento) return mostrarMensagem('Informe a data do pagamento.', 'erro');
    const valor = lerValor(dados.Valor);
    if (!valor || Number.isNaN(valor)) return mostrarMensagem('Informe o valor recebido (ex.: 1.500,00).', 'erro');
    const botao = document.getElementById('btn-salvar-pagamento');
    botao.disabled = true; botao.textContent = 'Salvando…';
    let pago = null;
    try {
      pago = await chamar('registrarPagamento', c.ID_Imovel, c.data, dados, auth());
      if (estado.comprovante) {
        mostrarAvisoFixo('Enviando o comprovante…');
        await chamar('anexarComprovante', pago.ID_Pagamento, await lerArquivo(estado.comprovante), auth());
      }
      document.getElementById('progresso-envio')?.remove();
      fecharJanela();
      mostrarMensagem('Pagamento registrado!');
      recarregarPagamentos();
    } catch (erro) {
      document.getElementById('progresso-envio')?.remove();
      if (pago) { // o pagamento ficou salvo; só o comprovante falhou
        fecharJanela();
        mostrarMensagem('O pagamento foi registrado, mas o comprovante não foi enviado: ' + (erro.message || erro) + ' Use "Anexar comprovante".', 'erro');
        return recarregarPagamentos();
      }
      botao.disabled = false; botao.textContent = 'Salvar pagamento';
      mostrarErro(erro);
    }
  }

  function abrirComprovante(lista, n) {
    const c = cobrancaDaTela(lista, n);
    if (!c || !c.pagamento) return;
    estado.comprovante = null;
    abrirJanela('Anexar comprovante', `
      <div class="com-capa">${avatarImovel(c.Nome, c.Capa)}<div><b>${esc(c.Nome)}</b>
        <div class="suave pequeno">Pago em ${dataBR(c.pagamento.DataPagamento)} · ${esc(dinheiro(c.pagamento.Valor))}</div></div></div>
      ${campoComprovante()}`, '',
      `<button type="button" class="pr-btn pr-btn--sec" onclick="fecharJanela()">Cancelar</button>
       <button type="button" class="pr-btn pr-btn--pri" id="btn-salvar-comprovante" onclick="salvarComprovante('${lista}', ${n})">Salvar comprovante</button>`);
  }

  async function salvarComprovante(lista, n) {
    const c = cobrancaDaTela(lista, n);
    if (!estado.comprovante) return mostrarMensagem('Escolha a foto ou o PDF do comprovante.', 'erro');
    const botao = document.getElementById('btn-salvar-comprovante');
    botao.disabled = true; botao.textContent = 'Enviando…';
    try {
      await chamar('anexarComprovante', c.pagamento.ID_Pagamento, await lerArquivo(estado.comprovante), auth());
      document.getElementById('progresso-envio')?.remove();
      fecharJanela();
      mostrarMensagem('Comprovante anexado!');
      recarregarPagamentos();
    } catch (erro) {
      document.getElementById('progresso-envio')?.remove();
      botao.disabled = false; botao.textContent = 'Salvar comprovante';
      mostrarErro(erro);
    }
  }

  // Mostra o comprovante dentro do portal: foto em tamanho grande, PDF com as páginas desenhadas
  async function verComprovante(lista, n) {
    const c = cobrancaDaTela(lista, n);
    if (!c || !c.pagamento || !c.pagamento.ComprovanteUrl) return;
    const url = c.pagamento.ComprovanteUrl;
    abrirJanela('Comprovante · ' + esc(c.Nome), '<div id="area-comprovante" class="paginas-pdf"><div class="carregando"><div class="girando"></div>Abrindo o comprovante…</div></div>',
      'janela--larga', `<button type="button" class="pr-btn pr-btn--sec" onclick="abrirAnexo(event, '${esc(url)}')">Baixar</button>
       <button type="button" class="pr-btn pr-btn--pri" onclick="fecharJanela()">Fechar</button>`);
    let ativo = true;
    estado.aoFecharJanela = () => { ativo = false; };
    try {
      const a = await chamar('baixarArquivo', url, auth());
      const area = document.getElementById('area-comprovante');
      if (!ativo || !area) return;
      const blob = base64ParaBlob(a.base64, a.tipo);
      if (/pdf/i.test(a.tipo)) await desenharPdf(new Uint8Array(await blob.arrayBuffer()), area, () => ativo);
      else area.innerHTML = `<img class="visor-img" src="${URL.createObjectURL(blob)}" alt="Comprovante de ${esc(c.Nome)}">`;
    } catch (erro) {
      const area = document.getElementById('area-comprovante');
      if (area) area.innerHTML = `<p>Não deu para mostrar o comprovante aqui (${esc(erro.message || erro)}). Use "Baixar".</p>`;
    }
  }

  async function desfazerPagamentoTela(lista, n) {
    const c = cobrancaDaTela(lista, n);
    if (!c || !c.pagamento) return;
    if (!confirm(`Desfazer o pagamento de ${c.Nome} (cobrança de ${dataBR(c.data)})? O comprovante vai para a lixeira do Google Drive.`)) return;
    try {
      await chamar('desfazerPagamento', c.pagamento.ID_Pagamento, auth());
      mostrarMensagem('Pagamento desfeito.');
      recarregarPagamentos();
    } catch (erro) { mostrarErro(erro); }
  }

  function telaErro(erro, rota) {
    tela(`<div class="tela-login"><h1>Não foi possível abrir</h1><p class="suave">${esc(erro.message || erro)}</p>
      <button class="pr-btn pr-btn--pri largo" onclick="navegar('${rota}')">Tentar de novo</button></div>`, true);
  }

  /* =========================================================
   * Lista de imóveis
   * ========================================================= */
  async function telaImoveis(filtro) {
    estado.filtro = NOMES_SITUACAO[filtro] ? filtro : 'todos';
    try {
      await carregarTela('imoveis', () => chamar('listarImoveis', auth()), desenharImoveis, 'Carregando os imóveis…');
    } catch (erro) { telaErro(erro, '#/imoveis'); }
  }

  function desenharImoveis(dados, atualizacao) {
    if (paginaAtual() !== 'imoveis') return;
    estado.lista = dados;
    // Versão nova chegando por trás: só troca os resultados (a busca digitada e o foco continuam)
    if (atualizacao && document.getElementById('resultados')) {
      document.querySelector('.titulo-pagina .rotulo').textContent = `${dados.imoveis.length} ${dados.imoveis.length === 1 ? 'imóvel' : 'imóveis'}`;
      return desenharResultados();
    }
    tela(`<div class="tela-fixa">
      <div class="titulo-pagina"><div>
        <span class="rotulo">${estado.lista.imoveis.length} ${estado.lista.imoveis.length === 1 ? 'imóvel' : 'imóveis'}</span>
        <h1>Imóveis</h1>
      </div><a class="pr-btn pr-btn--pri" href="#/novo">${ICONE.mais}Adicionar imóvel</a></div>
      <div id="busca-ativa"></div>
      <div class="filtros" role="group" aria-label="Filtrar por situação do pagamento" id="filtros"></div>
      <div id="resultados" class="crescer"></div>
      <div class="legenda"><span class="rotulo">Legenda</span>
        <span class="st st--ok">Em dia</span><span>nada atrasado</span>
        <span class="st st--aviso">Vence em breve</span><span>vence em até 3 dias</span>
        <span class="st st--vencido">Atrasado</span><span>tem aluguel vencido sem pagamento</span>
        <span class="st st--sem-prazo">Vago</span><span>sem inquilino</span></div></div>`);
    desenharResultados();
  }

  function escolherFiltro(f) {
    estado.filtro = f;
    history.replaceState(null, '', '#/imoveis' + (f === 'todos' ? '' : '?f=' + f));
    desenharResultados();
  }

  function limparBusca() {
    estado.busca = '';
    const campo = document.getElementById('busca-topo');
    if (campo) campo.value = '';
    desenharResultados();
  }

  function desenharResultados() {
    const achados = filtrarImoveis(estado.lista.imoveis, estado.busca);
    const ativa = document.getElementById('busca-ativa');
    if (ativa) ativa.innerHTML = estado.busca.trim() ? `<div class="busca-ativa">Resultados para <b>“${esc(estado.busca.trim())}”</b>
      <button type="button" class="pr-btn pr-btn--texto pr-btn--pequeno" onclick="limparBusca()">Limpar busca</button></div>` : '';
    const campo = document.getElementById('busca-topo');
    if (campo && campo.value !== estado.busca) campo.value = estado.busca;
    const conta = s => achados.filter(i => s === 'todos' || i.situacao === s).length;
    const opcoes = ['todos', 'ok', 'aviso', 'vencido'].concat(conta('sem-prazo') ? ['sem-prazo'] : []);
    document.getElementById('filtros').innerHTML = opcoes.map(f =>
      `<button class="filtro" aria-pressed="${estado.filtro === f}" onclick="escolherFiltro('${f}')">${NOMES_SITUACAO[f]}<span class="mono">${conta(f)}</span></button>`).join('');

    const lista = achados.filter(i => estado.filtro === 'todos' || i.situacao === estado.filtro)
      .sort((a, b) => (ORDEM_SITUACAO[a.situacao] - ORDEM_SITUACAO[b.situacao]) || String(a.proximoVencimento).localeCompare(String(b.proximoVencimento)));
    const area = document.getElementById('resultados');
    if (!lista.length) {
      area.innerHTML = `<div class="painel"><p class="vazio">${estado.lista.imoveis.length
        ? 'Nenhum imóvel encontrado com essa busca ou filtro.'
        : 'Nenhum imóvel cadastrado ainda. <a href="#/novo">Incluir o primeiro imóvel</a>'}</p></div>`;
      return;
    }
    area.innerHTML = `
      <div class="caixa-tabela">
        <table class="tabela">
          <thead><tr><th>Imóvel</th><th>Inquilino</th><th>Cobrança</th><th>Próximo vencimento</th><th>Situação</th><th><span class="sr">Ações</span></th></tr></thead>
          <tbody>${lista.map(i => `
            <tr class="clicavel" onclick="if (!event.target.closest('a')) navegar('#/imovel/${esc(i.ID_Imovel)}')">
              <td><div class="com-capa">${avatarImovel(i.Nome, i.Capa)}<div><div class="nome">${esc(i.Nome)}</div>
                ${i.Localizacao ? `<div class="suave pequeno">${esc(i.Localizacao)}</div>` : ''}
                ${textoAluguel(i) ? `<div class="valor-aluguel">${esc(textoAluguel(i))}</div>` : ''}
                <div class="suave" style="font-size:13px">Cadastrado em ${dataBR(i.DataCadastro)}</div></div></div></td>
              <td>${esc(i.Inquilino) || '<span class="suave">—</span>'}</td>
              <td>${esc(textoCobranca(i))}</td>
              <td class="data"><b>${dataBR(i.proximoVencimento)}</b></td>
              <td>${etiquetaSituacao(i)}</td>
              <td><a class="pr-btn pr-btn--texto pr-btn--pequeno" href="#/imovel/${esc(i.ID_Imovel)}" aria-label="Editar ${esc(i.Nome)}">${ICONE.lapis}Editar</a></td>
            </tr>`).join('')}</tbody>
        </table>
      </div>
      <div class="lista-cartoes rolagem">${lista.map(i => `
        <a class="cartao-imovel" href="#/imovel/${esc(i.ID_Imovel)}">
          <div class="linha"><div class="com-capa">${avatarImovel(i.Nome, i.Capa)}<b>${esc(i.Nome)}</b></div>${etiquetaSituacao(i)}</div>
          ${i.Localizacao ? `<span class="suave pequeno">${esc(i.Localizacao)}</span>` : ''}
          ${textoAluguel(i) ? `<span class="valor-aluguel">${esc(textoAluguel(i))}</span>` : ''}
          <span class="pequeno">${i.Cobrar ? `${esc(i.Inquilino || 'Sem inquilino')} · vence <b class="mono">${dataBR(i.proximoVencimento)}</b>` : 'Vago'}</span>
          <span class="editar-cartao">${ICONE.lapis}Editar</span>
        </a>`).join('')}</div>`;
  }

          <a href="#/imoveis" class="pr-btn pr-btn--sec">Cancelar</a>
          <button class="pr-btn pr-btn--pri" id="btn-salvar">${novo ? 'Salvar imóvel' : 'Salvar mudanças'}</button>

    atualizarCobranca();
    atualizarMapa();
    if (novo) document.getElementById('f-Nome').focus();
  }

  /* ---------- Mapa da localização (Google Maps incorporado) ----------
   * Um iframe com o modo "embed" do Google Maps: gratuito e sem chave de API.
   * Atualiza 1 segundo depois que a pessoa para de digitar (debounce), ou ao sair do campo. */
  function agendarMapa() {
    clearTimeout(estado.timerMapa);
    estado.timerMapa = setTimeout(atualizarMapa, 1000);
  }

  function atualizarMapa() {
    clearTimeout(estado.timerMapa);
    const campo = document.getElementById('f-Localizacao');
    const area = document.getElementById('mapa-local');
    if (!campo || !area) return;
    const endereco = campo.value.trim();
    if (endereco === area.dataset.endereco) return; // o mesmo endereço: não recarrega o mapa
    area.dataset.endereco = endereco;
    if (endereco.length < 5) { area.innerHTML = ''; return; }
    const q = encodeURIComponent(endereco);
    area.innerHTML = `
      <iframe src="https://www.google.com/maps?q=${q}&output=embed&hl=pt-BR" title="Mapa: ${esc(endereco)}"
        loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>
      <div class="acoes">
        <a class="pr-btn pr-btn--sec pr-btn--pequeno" href="https://www.google.com/maps/search/?api=1&query=${q}" target="_blank" rel="noopener">Abrir no Google Maps</a>
        <a class="pr-btn pr-btn--sec pr-btn--pequeno" href="https://www.google.com/maps/dir/?api=1&destination=${q}" target="_blank" rel="noopener">Como chegar</a>
        <span class="suave pequeno">Confira se o marcador está no lugar certo.</span>
      </div>`;
  }

  // Mostra ou esconde os campos de cobrança e calcula as próximas datas na hora
  function atualizarCobranca() {
    const f = estado.form, i = f.imovel || {};
    const sim = document.getElementById('f-Cobrar').value === 'Sim';
    document.querySelectorAll('.so-cobranca').forEach(el => { el.hidden = !sim; });
    document.getElementById('aviso-vago').hidden = sim || !i.Cobrar; // estava alugado e vai ficar vago
    if (!sim) return;
    const dia = Number(document.getElementById('f-DiaVencimento').value);
    const previa = document.getElementById('previa-cobranca');
    if (!dia) {
      previa.innerHTML = `<span class="pr-alert__ic">${ICONE.agenda}</span><div><b>Vencimento</b>Escolha o dia do vencimento.</div>`;
      return;
    }
    const hoje = hojeISO();
    // Mesmo dia de antes: a cobrança continua de onde estava. Dia novo (ou imóvel que estava vago): começa no próximo vencimento.
    const continua = i.Cobrar && Number(i.DiaVencimento) === dia && i.proximoVencimento;
    const primeira = continua ? i.proximoVencimento : proximoDiaDoMes(dia, hoje);
    const depois = [proximaCobranca('Todo mês no mesmo dia', primeira, somarDias(primeira, 1))];
    depois.push(proximaCobranca('Todo mês no mesmo dia', primeira, somarDias(depois[0], 1)));
    const valor = lerValor(document.getElementById('f-ValorAluguel').value);
    const titulo = continua ? (i.situacao === 'vencido' ? 'Aluguel atrasado desde' : 'Próximo vencimento') : 'Primeira cobrança';
    previa.innerHTML = `<span class="pr-alert__ic">${ICONE.agenda}</span><div>
      <b>${titulo}: ${dataComDia(primeira)}${primeira >= hoje ? ` (${quandoCobrar(diasEntre(hoje, primeira)).toLowerCase()})` : ''}${valor ? ' · ' + esc(dinheiro(valor)) : ''}</b>
      Depois: ${depois.map(dataBR).join(' e ')}.
      ${Number.isNaN(valor) ? '<br><span class="aviso-campo">Valor inválido. Use, por exemplo, 1.500,00.</span>' : ''}</div>`;
  }

  /* ---------- Inquilino saiu ---------- */
  function abrirSaidaInquilino() {

    const desde = i.AlugadoDesde ? String(i.AlugadoDesde).slice(0, 10) : '';

      ${i.qtdAtrasadas ? `<div class="pr-alert pr-alert--atencao"><span class="pr-alert__ic">!</span><div><b>Ficou em aberto: ${i.qtdAtrasadas} ${i.qtdAtrasadas === 1 ? 'aluguel' : 'aluguéis'} (${esc(dinheiro(i.valorAtrasado))})</b>
        Isso não fica como vencido no portal; fica anotado no histórico do inquilino.</div></div>` : ''}`, '',
      `<button type="button" class="pr-btn pr-btn--sec" onclick="fecharJanela()">Cancelar</button>

  function formatarValor(campo) {
    const v = lerValor(campo.value);
    if (v !== '' && !Number.isNaN(v)) campo.value = v.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function desenharAnexos() {
    const f = estado.form;
    const i = f.imovel || { Fotos: [] };
    const ehCapa = foto => !!f.capa && (f.capa.foto ? f.capa.foto === foto : f.capa.url === foto.url);
    const botaoCapa = (foto, chamada) => `<button type="button" class="estrela" onclick="${chamada}" aria-pressed="${ehCapa(foto)}"
        aria-label="${ehCapa(foto) ? 'Ajustar ou tirar a foto de perfil' : 'Usar como foto de perfil'}">${ICONE.estrela}Perfil</button>`;
    const fotosSalvas = i.Fotos.map((foto, n) => `
      <div class="foto${ehCapa(foto) ? ' foto--capa' : ''}">
        ${estado.miniaturas[foto.url]
          ? `<img src="${estado.miniaturas[foto.url]}" alt="${esc(foto.nome)}" onclick="verFoto(${n})">`
          : `<button type="button" class="foto-carregando" data-miniatura="${esc(foto.url)}" onclick="verFoto(${n})" aria-label="Ver ${esc(foto.nome)}">FOTO</button>`}
        <button type="button" class="tirar" onclick="tirarFotoSalva('${esc(foto.url)}')" aria-label="Remover a foto ${esc(foto.nome)}">${ICONE.x}</button>
        ${botaoCapa(foto, `escolherCapa('salva', ${n})`)}
      </div>`).join('');
    const fotosNovas = f.fotosNovas.map((foto, n) => `
      <div class="foto nova${ehCapa(foto) ? ' foto--capa' : ''}" title="Será enviada ao salvar">
        <img src="${foto.previa}" alt="Foto nova: ${esc(foto.arquivo.name)}" onclick="verFoto(${i.Fotos.length + n})">
        <button type="button" class="tirar" onclick="tirarFotoNova(${n})" aria-label="Não enviar ${esc(foto.arquivo.name)}">${ICONE.x}</button>
        ${botaoCapa(foto, `escolherCapa('nova', ${n})`)}
      </div>`).join('');
    const documentos = (i.Documentos || []).map((doc, n) => linhaDocumento(doc.nome, 's' + n, false))
      .concat(f.documentosNovos.map((doc, n) => linhaDocumento(doc.arquivo.name, 'n' + n, true))).join('');

    document.getElementById('anexos').innerHTML = `
      <div class="pr-field">
        <span style="font:600 14px/20px var(--font-sans)">Fotos do imóvel</span>
        <label class="area-envio" for="campo-fotos">${ICONE.foto}Escolher fotos<span>Pode tirar na hora pelo tablet ou celular</span></label>
        <input id="campo-fotos" type="file" accept="image/*,.heic,.heif" multiple class="sr" onchange="escolherFotos(this)">
        ${fotosSalvas || fotosNovas ? `<div class="fotos">${fotosSalvas}${fotosNovas}</div>` : ''}
        ${fotosSalvas || fotosNovas ? '<small>Toque numa foto para ver grande. Toque em <b>Perfil</b> para escolher e enquadrar a foto de perfil do imóvel, que aparece ao lado do nome.</small>' : ''}
        ${f.fotosNovas.length ? `<small>${f.fotosNovas.length === 1 ? 'A foto com borda laranja é enviada' : 'As fotos com borda laranja são enviadas'} ao salvar.</small>` : ''}
      </div>
      <div class="pr-field">
        <span style="font:600 14px/20px var(--font-sans)">Documentos</span>
        <label class="area-envio" for="campo-documentos">${ICONE.pdf}Adicionar documentos<span>RG, comprovante de endereço, recibos… (foto ou PDF)</span></label>
        <input id="campo-documentos" type="file" accept="image/*,.heic,.heif,application/pdf" multiple class="sr" onchange="escolherDocumentos(this)">
        ${documentos}
        ${f.documentosNovos.length ? `<small>${f.documentosNovos.length === 1 ? 'O documento marcado como Novo é enviado' : 'Os documentos marcados como Novo são enviados'} ao salvar.</small>` : ''}
      </div>`;
    carregarMiniaturas();
  }

  // Nomes como "Contrato%20s%C3%A9rie.pdf" ficam legíveis ("Contrato série.pdf") quando dá
  function nomeLegivel(nome) {
    try { return decodeURIComponent(String(nome)); } catch (e) { return String(nome); }
  }

  /* ---------- Fotos HEIC (câmera de muitos celulares) ----------
   * O navegador não mostra HEIC. Ao escolher, a foto é convertida para JPG no próprio aparelho. */
  function ehHeic(arquivo) {
    return /image\/hei[cf]/i.test(arquivo.type) || /\.hei[cf]$/i.test(arquivo.name);
  }

  async function converterHeic(blob, nome) {
    await carregarScript('https://cdnjs.cloudflare.com/ajax/libs/heic2any/0.0.4/heic2any.min.js');
    let jpg = await heic2any({ blob, toType: 'image/jpeg', quality: 0.85 });
    if (Array.isArray(jpg)) jpg = jpg[0]; // fotos "ao vivo" vêm com várias imagens: fica a primeira
    return new File([jpg], String(nome || 'foto').replace(/\.\w+$/, '') + '.jpg', { type: 'image/jpeg' });
  }

  async function escolherFotos(campo) {
    const arquivos = [...campo.files];
    campo.value = '';
    for (let arquivo of arquivos) {
      const heic = ehHeic(arquivo);
      if (!heic && !arquivo.type.startsWith('image/')) { mostrarMensagem(`${arquivo.name} não é uma foto.`, 'erro'); continue; }
      if (heic) {
        mostrarAvisoFixo(`Convertendo ${arquivo.name} para JPG…`);
        try { arquivo = await converterHeic(arquivo, arquivo.name); } catch (e) {
          document.getElementById('progresso-envio')?.remove();
          mostrarMensagem(`Não deu para converter ${arquivo.name}. Tente tirar a foto em JPG.`, 'erro');
          continue;
        }
      }
      estado.form.fotosNovas.push({ arquivo, previa: URL.createObjectURL(arquivo) });
    }
    document.getElementById('progresso-envio')?.remove();
    desenharAnexos();
  }

  function tirarFotoNova(n) {
    const f = estado.form;
    const [foto] = f.fotosNovas.splice(n, 1);
    if (foto) URL.revokeObjectURL(foto.previa);
    // Era a capa escolhida: volta para a capa que já estava salva (se tinha)
    if (f.capa && f.capa.foto === foto) f.capa = f.imovel && f.imovel.CapaUrl ? { url: f.imovel.CapaUrl } : null;
    desenharAnexos();
  }

  // Endereço para mostrar uma foto salva no Drive (baixa uma vez e guarda; HEIC antigo vira JPG)
  async function enderecoDaFoto(url) {
    if (estado.miniaturas[url]) return estado.miniaturas[url];
    const a = await chamar('baixarArquivo', url, auth());
    let blob = base64ParaBlob(a.base64, a.tipo);
    if (/hei[cf]/i.test(a.tipo) || /\.hei[cf]$/i.test(a.nome)) blob = await converterHeic(blob, a.nome);
    return (estado.miniaturas[url] = URL.createObjectURL(blob));
  }

  /* ---------- Janela por cima da página (visualizador e enquadramento) ---------- */
  function abrirJanela(titulo, conteudo, classe, rodape) {
    fecharJanela();
    const fundo = document.createElement('div');
    fundo.className = 'janela-fundo';
    fundo.id = 'janela';
    fundo.innerHTML = `<div class="janela ${classe || ''}" role="dialog" aria-modal="true" aria-labelledby="janela-titulo">
      <div class="janela-topo"><h2 id="janela-titulo">${titulo}</h2>
        <button type="button" class="botao-fechar" onclick="fecharJanela()" aria-label="Fechar">${ICONE.x}</button></div>
      <div class="janela-corpo">${conteudo}</div>${rodape ? `<div class="janela-rodape">${rodape}</div>` : ''}</div>`;
    fundo.addEventListener('click', e => { if (e.target === fundo) fecharJanela(); });
    document.body.appendChild(fundo);
    document.body.classList.add('com-janela');
    fundo.querySelector('.botao-fechar').focus();
    return fundo;
  }

  function fecharJanela() {
    const j = document.getElementById('janela');
    if (j) { j.remove(); if (estado.aoFecharJanela) estado.aoFecharJanela(); }
    estado.aoFecharJanela = null;
    document.body.classList.remove('com-janela');
  }

  document.addEventListener('keydown', e => {
    if (!document.getElementById('janela')) return;
    if (e.key === 'Escape') fecharJanela();
    if (estado.visor && e.key === 'ArrowRight') verFoto(estado.visor.n + 1);
    if (estado.visor && e.key === 'ArrowLeft') verFoto(estado.visor.n - 1);
  });

  /* ---------- Visualizador de fotos ---------- */
  function todasAsFotos() {
    const f = estado.form;
    return ((f.imovel && f.imovel.Fotos) || []).map(foto => ({ nome: foto.nome, url: foto.url }))
      .concat(f.fotosNovas.map(foto => ({ nome: foto.arquivo.name, previa: foto.previa })));
  }

  async function verFoto(n) {
    const fotos = todasAsFotos();
    if (!fotos.length) return;
    n = (n + fotos.length) % fotos.length;
    estado.visor = { n };
    const foto = fotos[n];
    const navegacao = fotos.length > 1 ? `
      <button type="button" class="visor-seta esquerda" onclick="verFoto(${n - 1})" aria-label="Foto anterior">‹</button>
      <button type="button" class="visor-seta direita" onclick="verFoto(${n + 1})" aria-label="Próxima foto">›</button>` : '';
    abrirJanela(`Foto ${n + 1} de ${fotos.length}`, `
      <div class="visor"><div class="carregando" id="visor-foto"><div class="girando"></div>Abrindo a foto…</div>${navegacao}</div>
      <p class="suave pequeno visor-nome">${esc(nomeLegivel(foto.nome))}</p>`, 'janela--larga');
    estado.aoFecharJanela = () => { estado.visor = null; };
    try {
      const endereco = foto.previa || await enderecoDaFoto(foto.url);
      const lugar = document.getElementById('visor-foto');
      if (lugar && estado.visor && estado.visor.n === n) lugar.outerHTML = `<img class="visor-img" src="${endereco}" alt="${esc(nomeLegivel(foto.nome))}">`;
      if (foto.url) { const quadro = document.querySelector(`#anexos [data-miniatura="${CSS.escape(foto.url)}"]`); if (quadro) desenharAnexos(); }
    } catch (erro) {
      const lugar = document.getElementById('visor-foto');
      if (lugar) lugar.innerHTML = `<p>${esc(erro.message || erro)}</p>`;
    }
  }

  /* ---------- Visualizador de documento (foto ou PDF) ----------
   * As páginas do PDF são desenhadas dentro do portal (no tablet, abrir o PDF em outra aba às vezes só baixa). */
  const PAGINAS_MAXIMAS = 40;

  async function verDocumento(chave) {
    const doc = documentoDaChave(chave);
    estado.docAberto = doc;
    abrirJanela(esc(nomeLegivel(doc.nome)), '<div class="paginas-pdf" id="paginas-pdf"><div class="carregando"><div class="girando"></div>Abrindo o documento…</div></div>',
      'janela--larga', `<button type="button" class="pr-btn pr-btn--sec" onclick="baixarDocumento()">Baixar</button>
      <button type="button" class="pr-btn pr-btn--pri" onclick="fecharJanela()">Fechar</button>`);
    let ativo = true;
    estado.aoFecharJanela = () => { ativo = false; };
    try {
      let blob;
      if (doc.novo) blob = doc.arquivo;
      else { const a = await chamar('baixarArquivo', doc.url, auth()); blob = base64ParaBlob(a.base64, a.tipo); }
      const area = document.getElementById('paginas-pdf');
      if (!ativo || !area) return;
      if (/pdf/i.test(blob.type)) await desenharPdf(new Uint8Array(await blob.arrayBuffer()), area, () => ativo);
      else area.innerHTML = `<img class="visor-img" src="${URL.createObjectURL(blob)}" alt="${esc(nomeLegivel(doc.nome))}">`;
    } catch (erro) {
      const area = document.getElementById('paginas-pdf');
      if (area) area.innerHTML = `<p>Não deu para mostrar o documento aqui (${esc(erro.message || erro)}). Use "Baixar".</p>`;
    }
  }

  // Desenha as páginas de um PDF (bytes) dentro de "area", uma embaixo da outra (pdf.js)
  async function desenharPdf(bytes, area, continua) {
    await carregarScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const pdf = await pdfjsLib.getDocument({ data: bytes }).promise;
    if (!continua() || !area) return;
    area.innerHTML = '';
    const total = Math.min(pdf.numPages, PAGINAS_MAXIMAS);
    for (let p = 1; p <= total && continua(); p++) {
      const pagina = await pdf.getPage(p);
      const base = pagina.getViewport({ scale: 1 });
      const largura = Math.min(area.clientWidth || 800, 900);
      const vp = pagina.getViewport({ scale: largura / base.width * Math.min(window.devicePixelRatio || 1, 2) });
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(vp.width); canvas.height = Math.round(vp.height);
      canvas.setAttribute('aria-label', `Página ${p} de ${pdf.numPages}`);
      area.appendChild(canvas);
      await pagina.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
    }
    if (continua() && pdf.numPages > PAGINAS_MAXIMAS) {
      area.insertAdjacentHTML('beforeend', `<p class="suave">Mostrando as ${PAGINAS_MAXIMAS} primeiras de ${pdf.numPages} páginas. Baixe o PDF para ver tudo.</p>`);
    }
  }

  function baixarDocumento() {
    const doc = estado.docAberto;
    if (!doc) return;
    if (!doc.novo) return abrirAnexo({ preventDefault() {} }, doc.url);
    const endereco = URL.createObjectURL(doc.arquivo);
    const link = document.createElement('a');
    link.href = endereco; link.download = doc.arquivo.name;
    document.body.appendChild(link); link.click(); link.remove();
    setTimeout(() => URL.revokeObjectURL(endereco), 60000);
  }

  /* ---------- Escolher e enquadrar a foto de capa ----------
   * Abre a foto com um círculo por cima: arrastar move a foto, o controle aproxima/afasta.
   * O que fica dentro do círculo vira a thumbnail do avatar (crop com pan e zoom). */
  const LADO_MINIATURA = 200; // nítida até o avatar grande do título (96 px em telas de alta definição)

  async function escolherCapa(tipo, n) {
    const f = estado.form;
    const escolha = tipo === 'nova' ? { foto: f.fotosNovas[n] } : { url: f.imovel.Fotos[n].url };
    const jaEra = !!f.capa && (escolha.foto ? f.capa.foto === escolha.foto : f.capa.url === escolha.url);
    abrirJanela('Enquadrar a foto de perfil', `
      <p class="suave pequeno">Arraste a foto para posicionar e use o controle para aproximar. O que ficar dentro do círculo vira a foto de perfil do imóvel.</p>
      <div class="recorte" id="recorte"><div class="carregando"><div class="girando"></div>Abrindo a foto…</div></div>
      <div class="pr-field"><label for="recorte-zoom">Aproximar</label>
        <input id="recorte-zoom" type="range" min="1" max="4" step="0.01" value="1" disabled></div>`, '', `
        ${jaEra ? '<button type="button" class="pr-btn pr-btn--perigo" onclick="confirmarCapa(\'tirar\')" style="margin-right:auto">Tirar foto de perfil</button>' : ''}
        <button type="button" class="pr-btn pr-btn--sec" onclick="fecharJanela()">Cancelar</button>
        <button type="button" class="pr-btn pr-btn--pri" id="btn-usar-recorte" onclick="confirmarCapa('usar')" disabled>Salvar foto de perfil</button>`);
    estado.recorte = { escolha };
    estado.aoFecharJanela = () => { estado.recorte = null; };
    try {
      const endereco = escolha.foto ? escolha.foto.previa : await enderecoDaFoto(escolha.url);
      const img = new Image();
      img.src = endereco;
      await img.decode();
      if (!estado.recorte || estado.recorte.escolha !== escolha) return;
      montarRecorte(img);
    } catch (erro) {
      const lugar = document.getElementById('recorte');
      if (lugar) lugar.innerHTML = `<p>Não deu para abrir a foto (${esc(erro.message || erro)}).</p>`;
    }
  }

  function montarRecorte(img) {
    const r = estado.recorte;
    const area = document.getElementById('recorte');
    area.innerHTML = '<canvas aria-label="Foto para enquadrar"></canvas><div class="recorte-circulo" aria-hidden="true"></div>';
    const canvas = area.querySelector('canvas');
    const lado = area.clientWidth || 300;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = canvas.height = Math.round(lado * dpr);
    Object.assign(r, { img, lado, dpr, canvas, zoom: 1, x: 0, y: 0,
      cobrir: lado / Math.min(img.naturalWidth, img.naturalHeight) }); // escala em que a foto cobre o quadro todo
    const zoom = document.getElementById('recorte-zoom');
    zoom.disabled = false;
    zoom.oninput = () => { r.zoom = Number(zoom.value); desenharRecorte(); };
    document.getElementById('btn-usar-recorte').disabled = false;
    // Arrastar com o dedo ou o mouse
    let inicio = null;
    canvas.onpointerdown = e => { canvas.setPointerCapture(e.pointerId); inicio = { px: e.clientX, py: e.clientY, x: r.x, y: r.y }; };
    canvas.onpointermove = e => {
      if (!inicio) return;
      r.x = inicio.x + (e.clientX - inicio.px);
      r.y = inicio.y + (e.clientY - inicio.py);
      desenharRecorte();
    };
    canvas.onpointerup = canvas.onpointercancel = () => { inicio = null; };
    // A roda do mouse também aproxima (no tablet, use o controle "Aproximar")
    canvas.onwheel = e => {
      e.preventDefault();
      r.zoom = Math.min(4, Math.max(1, r.zoom * (e.deltaY < 0 ? 1.08 : 0.92)));
      zoom.value = r.zoom; desenharRecorte();
    };
    desenharRecorte();
  }

  // Desenha a foto na posição e no zoom atuais (sem deixar sobrar borda vazia)
  function desenharRecorte(destino, ladoDestino) {
    const r = estado.recorte;
    const escala = r.cobrir * r.zoom;
    const w = r.img.naturalWidth * escala, h = r.img.naturalHeight * escala;
    r.x = Math.max(-(w - r.lado) / 2, Math.min((w - r.lado) / 2, r.x));
    r.y = Math.max(-(h - r.lado) / 2, Math.min((h - r.lado) / 2, r.y));
    const canvas = destino || r.canvas;
    const fator = (ladoDestino || r.lado * r.dpr) / r.lado;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(r.img, ((r.lado - w) / 2 + r.x) * fator, ((r.lado - h) / 2 + r.y) * fator, w * fator, h * fator);
  }

  async function confirmarCapa(acao) {
    const f = estado.form, r = estado.recorte;
    let escolha = null;
    if (acao !== 'tirar') {
      if (!r || !r.img) return;
      const saida = document.createElement('canvas');
      saida.width = saida.height = LADO_MINIATURA;
      desenharRecorte(saida, LADO_MINIATURA);
      escolha = { ...r.escolha, miniatura: saida.toDataURL('image/jpeg', 0.8) };
    }
    const botao = document.getElementById('btn-usar-recorte');
    // Foto que já está no portal (ou tirar a capa): grava agora, sem depender do Salvar do formulário
    const gravarAgora = f.imovel && f.imovel.ID_Imovel && (escolha ? !escolha.foto : !!f.imovel.CapaUrl);
    if (gravarAgora) {
      document.querySelectorAll('.janela-rodape button').forEach(b => { b.disabled = true; });
      if (botao) botao.textContent = 'Salvando…';
      try {
        f.imovel = await chamar('definirCapa', f.imovel.ID_Imovel, escolha ? escolha.url : '', escolha ? escolha.miniatura : '', auth());
        f.capa = f.imovel.CapaUrl ? { url: f.imovel.CapaUrl } : null;
      } catch (erro) {
        document.querySelectorAll('.janela-rodape button').forEach(b => { b.disabled = false; });
        if (botao) botao.textContent = 'Salvar foto de perfil';
        return mostrarErro(erro);
      }
    } else {
      f.capa = escolha; // foto nova: a capa vai junto quando as fotos forem enviadas
    }
    fecharJanela();
    desenharAnexos();
    const titulo = document.getElementById('titulo-capa');
    if (titulo && f.imovel) {
      const atual = titulo.querySelector('.capa');
      const html = avatarImovel(document.getElementById('f-Nome').value, gravarAgora ? f.imovel.Capa : (f.capa ? f.capa.miniatura : ''), true);
      if (atual) atual.outerHTML = html; else titulo.insertAdjacentHTML('afterbegin', html);
    }
    mostrarMensagem(gravarAgora ? (escolha ? 'Foto de perfil salva!' : 'Foto de perfil tirada.')
      : 'A foto de perfil será salva junto com as fotos quando você tocar em Salvar.');
  }

  // Grava a capa escolhida (depois que as fotos novas já foram enviadas e têm endereço)
  async function salvarCapa(id) {
    const f = estado.form;
    const antes = (f.imovel && f.imovel.CapaUrl) || '';
    if (!f.capa) {
      if (antes) f.imovel = await chamar('definirCapa', id, '', '', auth());
      return;
    }
    if (!f.capa.miniatura) return; // capa que já estava salva, sem mudança
    const url = f.capa.foto ? f.capa.foto.url : f.capa.url;
    if (!url) return;
    f.imovel = await chamar('definirCapa', id, url, f.capa.miniatura, auth());
  }

  /* ---------- Documentos ----------
   * Chave de cada documento na tela: "s0", "s1"... (já salvos) e "n0", "n1"... (novos, enviados ao salvar) */
  function linhaDocumento(nome, chave, novo) {
    const legivel = nomeLegivel(nome);
    if (estado.form.renomeandoDoc === chave) {
      const extensao = (legivel.match(/\.[A-Za-z0-9]{2,5}$/) || [''])[0];
      return `<div class="arquivo renomear">
        <label for="novo-nome-doc" class="sr">Novo nome do documento</label>
        <input id="novo-nome-doc" class="campo-renomear" maxlength="120" autocomplete="off"
          value="${esc(legivel.slice(0, legivel.length - extensao.length).replace(/\uFFFD/g, ''))}"
          onkeydown="if (event.key === 'Enter') { event.preventDefault(); salvarNomeDocumento(); }">
        <span class="suave pequeno">${esc(extensao)}</span>
        <button type="button" class="pr-btn pr-btn--pri pr-btn--pequeno" id="btn-nome-doc" onclick="salvarNomeDocumento()">Salvar nome</button>
        <button type="button" class="pr-btn pr-btn--texto pr-btn--pequeno" onclick="estado.form.renomeandoDoc = null; desenharAnexos()">Cancelar</button>
      </div>`;
    }
    return `<div class="arquivo">${ICONE.arquivo}<span class="arquivo-nome" title="${esc(legivel)}">${esc(legivel)}</span>
      ${novo ? '<span class="etiqueta" style="flex:none">Novo</span>' : ''}
      <button type="button" class="pr-btn pr-btn--texto pr-btn--pequeno" onclick="renomearDocumentoTela('${chave}')" aria-label="Renomear ${esc(legivel)}" title="Renomear">${ICONE.lapis}</button>
      <button type="button" class="pr-btn pr-btn--sec pr-btn--pequeno" onclick="verDocumento('${chave}')">Ver</button>
      <button type="button" class="pr-btn pr-btn--texto pr-btn--pequeno" onclick="tirarDocumento('${chave}')" aria-label="Remover ${esc(legivel)}">${ICONE.x}</button></div>`;
  }

  function documentoDaChave(chave) {
    const f = estado.form, n = Number(chave.slice(1));
    return chave[0] === 'n' ? { novo: true, n, arquivo: f.documentosNovos[n].arquivo, nome: f.documentosNovos[n].arquivo.name }
      : { novo: false, n, url: f.imovel.Documentos[n].url, nome: f.imovel.Documentos[n].nome };
  }

  async function escolherDocumentos(campo) {
    const arquivos = [...campo.files];
    campo.value = '';
    for (let arquivo of arquivos) {
      const pdf = arquivo.type === 'application/pdf';
      if (!pdf && !ehHeic(arquivo) && !arquivo.type.startsWith('image/')) { mostrarMensagem(`${arquivo.name} não é foto nem PDF.`, 'erro'); continue; }
      if (ehHeic(arquivo)) {
        mostrarAvisoFixo(`Convertendo ${arquivo.name} para JPG…`);
        try { arquivo = await converterHeic(arquivo, arquivo.name); } catch (e) { mostrarMensagem(`Não deu para converter ${arquivo.name}.`, 'erro'); continue; }
      }
      estado.form.documentosNovos.push({ arquivo });
    }
    document.getElementById('progresso-envio')?.remove();
    estado.form.renomeandoDoc = null;
    desenharAnexos();
  }

  function renomearDocumentoTela(chave) {
    estado.form.renomeandoDoc = chave;
    desenharAnexos();
    document.getElementById('novo-nome-doc').select();
  }

  // Novo: muda o nome só aqui (sobe com o nome novo). Salvo: muda no portal e no Drive. A extensão (.pdf, .jpg) continua.
  async function salvarNomeDocumento() {
    const f = estado.form;
    const doc = documentoDaChave(f.renomeandoDoc);
    const extensao = (nomeLegivel(doc.nome).match(/\.[A-Za-z0-9]{2,5}$/) || [''])[0];
    const nome = document.getElementById('novo-nome-doc').value.replace(/[\\/:*?"<>|\uFFFD]/g, '').trim();
    if (!nome) return mostrarMensagem('Digite o nome do documento.', 'erro');
    if (doc.novo) {
      f.documentosNovos[doc.n].arquivo = new File([doc.arquivo], nome + extensao, { type: doc.arquivo.type });
    } else {
      const botao = document.getElementById('btn-nome-doc');
      botao.disabled = true; botao.textContent = 'Salvando…';
      try { f.imovel = await chamar('renomearDocumento', f.imovel.ID_Imovel, doc.url, nome, auth()); }
      catch (erro) { botao.disabled = false; botao.textContent = 'Salvar nome'; return mostrarErro(erro); }
      mostrarMensagem('Nome do documento salvo!');
    }
    f.renomeandoDoc = null;
    desenharAnexos();
  }

  async function tirarDocumento(chave) {
    const f = estado.form;
    const doc = documentoDaChave(chave);
    if (doc.novo) { f.documentosNovos.splice(doc.n, 1); f.renomeandoDoc = null; return desenharAnexos(); }
    if (!confirm(`Remover "${nomeLegivel(doc.nome)}"? Ele vai para a lixeira do Google Drive.`)) return;
    try {
      f.imovel = await chamar('removerDocumento', f.imovel.ID_Imovel, doc.url, auth());
      f.renomeandoDoc = null;
      desenharAnexos();
      mostrarMensagem('Documento removido.');
    } catch (erro) { mostrarErro(erro); }
  }

  async function tirarFotoSalva(url) {
    if (!confirm('Remover esta foto? Ela vai para a lixeira do Google Drive.')) return;
    try {
      estado.form.imovel = await chamar('removerFoto', estado.form.imovel.ID_Imovel, url, auth());
      if (estado.form.capa && estado.form.capa.url === url) estado.form.capa = null;
      desenharAnexos();
      mostrarMensagem('Foto removida.');
    } catch (erro) { mostrarErro(erro); }
  }

  // As fotos ficam privadas no Drive: as miniaturas são baixadas uma por vez pelo servidor
  async function carregarMiniaturas() {
    if (estado.baixandoMiniaturas) return;
    estado.baixandoMiniaturas = true;
    try {
      let lugar;
      while ((lugar = document.querySelector('#anexos [data-miniatura]:not([data-tentou])'))) {
        const url = lugar.dataset.miniatura;
        lugar.dataset.tentou = '1';
        try {
          const endereco = await enderecoDaFoto(url);
          const atual = document.querySelector(`#anexos [data-miniatura="${CSS.escape(url)}"]`);
          if (atual) atual.outerHTML = `<img src="${endereco}" alt="" onclick="${atual.getAttribute('onclick')}">`;
        } catch (e) { /* fica o quadradinho "FOTO" */ }
      }
    } finally { estado.baixandoMiniaturas = false; }
  }


  async function salvarFormulario() {
    const f = estado.form;
    const dados = lerFormulario('form-imovel');
    if (!dados.Nome) return mostrarMensagem('Informe o nome do imóvel.', 'erro');
    if (dados.Cobrar === 'Sim' && !dados.Inquilino) return mostrarMensagem('Informe o nome do inquilino.', 'erro');
    if (dados.Cobrar === 'Sim' && !dados.DiaVencimento) return mostrarMensagem('Escolha o dia do vencimento.', 'erro');
    if (dados.Cobrar === 'Sim' && !lerValor(dados.ValorAluguel)) return mostrarMensagem('Informe o valor do aluguel por mês.', 'erro');
    if (dados.Cobrar === 'Sim' && Number.isNaN(lerValor(dados.ValorAluguel))) return mostrarMensagem('Valor do aluguel inválido. Use, por exemplo, 1.500,00.', 'erro');
    const botao = document.getElementById('btn-salvar');
    const textoBotao = botao.textContent;
    botao.disabled = true; botao.textContent = 'Salvando…';
    let id = f.imovel && f.imovel.ID_Imovel;
    try {
      const r = await chamar('salvarImovel', id || '', dados, auth());
      id = r.imovel.ID_Imovel;
      f.imovel = r.imovel;
      // Depois de salvar os dados, envia os anexos um por vez
      const total = f.fotosNovas.length;
      while (f.fotosNovas.length) {
        const foto = f.fotosNovas[0];
        mostrarAvisoFixo(`Enviando foto ${total - f.fotosNovas.length + 1} de ${total}…`);
        f.imovel = await chamar('anexarFoto', id, await lerArquivo(foto.arquivo), auth());
        foto.url = f.imovel.Fotos[f.imovel.Fotos.length - 1].url; // endereço no Drive, para a capa
        if (!(f.capa && f.capa.foto === foto)) URL.revokeObjectURL(foto.previa);
        f.fotosNovas.shift();
      }
      const totalDocs = f.documentosNovos.length;
      while (f.documentosNovos.length) {
        mostrarAvisoFixo(`Enviando documento ${totalDocs - f.documentosNovos.length + 1} de ${totalDocs}…`);
        f.imovel = await chamar('anexarDocumento', id, await lerArquivo(f.documentosNovos[0].arquivo), auth());
        f.documentosNovos.shift();
      }
      await salvarCapa(id);
      document.getElementById('progresso-envio')?.remove();
      if (r.avisoAgenda) mostrarMensagem(r.avisoAgenda, 'erro'); else mostrarMensagem('Imóvel salvo!');
      atualizarAvisos();
      navegar('#/imoveis');
    } catch (erro) {
      document.getElementById('progresso-envio')?.remove();
      botao.disabled = false; botao.textContent = textoBotao;
      // Os dados já foram salvos, mas um anexo falhou: fica na tela para tentar de novo
      if (id) {
        mostrarMensagem('Os dados foram salvos, mas um anexo não foi enviado: ' + (erro.message || erro) + ' Toque em Salvar para tentar de novo.', 'erro');
        if (location.hash !== '#/imovel/' + id) history.replaceState(null, '', '#/imovel/' + id);
        desenharAnexos();
      } else {
        mostrarErro(erro);
      }
    }
  }
