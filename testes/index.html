<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, viewport-fit=cover">
  <title>[TESTES] Az Gestão</title>
  <link rel="icon" type="image/png" href="icone-192.png">
  <!-- "só claro": impede o navegador do celular de escurecer o site sozinho -->
  <meta name="color-scheme" content="only light">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
  /* =========================================================
   * Visual Prumo: azul aço + laranja-telha, IBM Plex, cantos de 8px.
   * As cores ficam nas variáveis abaixo. O portal usa sempre o modo claro.
   * ========================================================= */
  :root {
    --brand: #0d4475; --on-brand: #ffffff; --brand-soft: #e7eef6; /* Az Gestão: o azul do logo e branco */
    --accent: #ea6b2c; --on-accent: #1a0c03;
    --surface-bg: #ffffff; --surface-card: #ffffff; --surface-sutil: #f4f6fa;
    --foco: #3d7bd9; /* contorno de foco (teclado), visível no branco e no azul */
    --ink: #16202e; --ink-muted: #5a6474;
    --line: #d6dae1; --line-strong: #8a93a3;
    --success: #1f7a4d; --success-soft: #e5f3ec;
    --warning: #9a5b00; --warning-soft: #fdf1df;
    --danger: #b42318; --danger-soft: #fbe9e7;
    --shadow-raised: 0 1px 2px rgba(22,32,46,.08), 0 4px 12px rgba(22,32,46,.06);
    --font-sans: "IBM Plex Sans", system-ui, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, monospace;
    --radius-sm: 6px; --radius-md: 8px; --radius-lg: 12px;
    color-scheme: only light; /* o navegador não pode escurecer o portal sozinho */
  }
  /* "Tema escuro" com as MESMAS cores claras, de propósito. Alguns navegadores (Samsung Internet,
     Chrome com o escurecimento forçado) escurecem à força os sites que não têm tema escuro próprio.
     Ao achar esta media query, eles entendem que o site já cuida disso e não mexem nas cores. */
  @media (prefers-color-scheme: dark) {
    :root { color-scheme: only light; }
    html, body { background: #ffffff; color: #16202e; }
  }
  * { box-sizing: border-box; }
  html { overflow-x: clip; } /* nada pode alargar a página para os lados */
  body { margin: 0; background: var(--surface-bg); color: var(--ink); font: 400 16px/24px var(--font-sans); }
  a { color: var(--brand); }
  a:hover { color: var(--ink); }
  h1 { margin: 0; font: 700 28px/34px var(--font-sans); }
  h2 { margin: 0; font: 600 22px/28px var(--font-sans); }
  h3 { margin: 0; font: 600 18px/24px var(--font-sans); }
  p { margin: 0; }
  h1, h2, h3, p, b, .cartao-imovel span, .aviso-item div { overflow-wrap: anywhere; }
  .tabela b, .tabela h3 { overflow-wrap: normal; }
  img, video { max-width: 100%; }
  button, input, select, textarea { font: inherit; color: inherit; }
  [hidden] { display: none !important; }
  .rotulo { font: 500 12px/16px var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted); }
  .suave { color: var(--ink-muted); }
  .pequeno { font-size: 14px; line-height: 20px; }
  .mono { font-family: var(--font-mono); font-weight: 500; font-variant-numeric: tabular-nums; }
  /* Escondido na tela, mas lido pelo leitor de tela. O !important vence regras como ".pr-field input { width: 100% }",
     que antes deixavam os campos de arquivo escondidos com a largura da tela e empurravam a página para o lado. */
  .sr { position: absolute !important; width: 1px !important; height: 1px !important; min-height: 0 !important;
    padding: 0 !important; margin: -1px !important; border: 0 !important; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  :focus-visible { outline: 3px solid var(--foco); outline-offset: 2px; }

  /* ---------- Topo (menu) ---------- */
  .topo { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    padding: max(8px, env(safe-area-inset-top)) 24px 8px; background: var(--brand); color: var(--on-brand); position: sticky; top: 0; z-index: 20; }
  .topo-esq, .topo-dir { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .topo-esq { gap: 24px; }
  .marca { display: flex; align-items: center; gap: 8px; font: 700 17px/1 var(--font-sans); color: var(--on-brand);
    text-decoration: none; min-height: 44px; }
  .marca:hover { color: var(--on-brand); }
  .selo { width: 28px; height: 28px; border-radius: var(--radius-sm); background: #ffffff; color: var(--brand);
    display: grid; place-items: center; font: 600 11px/1 var(--font-mono); }
  .menu { display: flex; gap: 4px; flex-wrap: wrap; }
  .menu a { color: var(--on-brand); text-decoration: none; font: 500 15px/1 var(--font-sans); padding: 14px 12px;
    border-radius: var(--radius-sm); opacity: .8; }
  .menu a[aria-current="page"] { opacity: 1; box-shadow: inset 0 -3px 0 #ffffff; }
  .menu a:hover { opacity: 1; }
  .contador { display: inline-block; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: #ffffff;
    color: var(--brand); font: 600 11px/18px var(--font-mono); text-align: center; vertical-align: 1px; }
  .botao-icone { position: relative; width: 44px; height: 44px; border: 0; border-radius: var(--radius-md); background: transparent;
    color: var(--on-brand); cursor: pointer; display: grid; place-items: center; }
  .botao-icone:hover { background: rgba(255,255,255,.12); }
  .botao-icone .contador { position: absolute; top: 3px; right: 2px; }
  .avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--brand-soft); color: var(--brand);
    display: grid; place-items: center; font: 600 14px/1 var(--font-sans); border: 0; cursor: pointer; }
  .so-celular { display: none; }
  .menu-baixo { display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--surface-card);
    border-top: 1px solid var(--line); padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); justify-content: space-around; }
  .menu-baixo a { position: relative; flex: 1; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2px; color: var(--ink-muted); text-decoration: none; font: 600 12px/16px var(--font-sans); border-radius: var(--radius-md); }
  .menu-baixo a[aria-current="page"] { color: var(--brand); }
  .menu-baixo a[aria-current="page"]::before { content: ""; position: absolute; top: 0; width: 32px; height: 3px; border-radius: 2px; background: var(--brand); }
  .menu-baixo a.incluir svg { width: 40px; height: 40px; padding: 8px; border-radius: 50%; background: var(--accent); color: var(--on-accent); }
  .menu-baixo a.incluir { color: var(--ink); }
  .menu-baixo .contador { position: absolute; top: 2px; left: calc(50% + 6px); }

  /* Painéis que abrem por cima (sininho e menu do usuário) */
  .flutuante { position: fixed; right: 16px; top: 64px; width: min(380px, calc(100vw - 32px)); max-height: 70vh; overflow: auto;
    background: var(--surface-card); color: var(--ink); border: 1px solid var(--line); border-radius: var(--radius-lg);
    box-shadow: var(--shadow-raised); padding: 8px 0; z-index: 30; }
  .flutuante-topo { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 16px; }
  .flutuante .vazio { padding: 16px; }
  .menu-usuario button { width: 100%; text-align: left; min-height: 44px; padding: 0 16px; border: 0; background: none; cursor: pointer; }
  .menu-usuario button:hover { background: var(--surface-sutil); }

  /* ---------- Logo ---------- */
  .logo-topo { height: 40px; width: auto; display: block; }
  .logo-login { width: min(260px, 80%); height: auto; display: block; margin: 0 auto 4px; }
  .saudacao { font-size: 20px; line-height: 26px; }
  .relatorio { display: flex; flex-direction: column; gap: 16px; }
  .tabela--painel { min-width: 640px; }
  .tabela--painel .capa { width: 40px; height: 40px; font-size: 14px; }
  .tabela--painel td.data, .tabela--painel td .st { white-space: nowrap; }
  /* Tela principal: 3 cartões de valor e 4 de imóveis, um ao lado do outro */
  .totais--valores { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .totais--imoveis { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  /* Destaque só com mouse: no celular o hover fica "grudado" depois do toque */
  @media (hover: hover) { .totais a.total:hover { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand); } }
  /* Seletor de período: atalhos e, no "Personalizado", as datas De/Até */
  .periodo { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
  .periodo-escolha { flex: 0 1 240px; }
  .periodo-datas { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; flex: 1 1 420px; }
  .periodo-datas[hidden] { display: none; }
  .periodo-datas .pr-field { flex: 1 1 150px; }
  /* Tela da categoria: o cartão fica no alto como cabeçalho (não é link) */
  .voltar { align-self: flex-start; }
  .total--cabecalho { border: 2px solid var(--brand); }
  .editar-cartao { display: inline-flex; align-items: center; gap: 4px; align-self: flex-end; color: var(--brand); font: 600 14px/20px var(--font-sans); }
  .editar-cartao svg { width: 16px; height: 16px; }

  /* ---------- Busca no cabeçalho ---------- */
  .topo-busca { position: relative; flex: 1 1 260px; max-width: 460px; }
  .topo-busca > svg { position: absolute; left: 12px; top: 12px; color: var(--ink-muted); pointer-events: none; }
  #busca-topo { width: 100%; min-height: 44px; padding: 10px 12px 10px 40px; border: 0; border-radius: var(--radius-md);
    background: #ffffff; color: var(--ink); font: 400 16px/24px var(--font-sans); }
  .sugestoes { position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 30; max-height: 70vh; overflow: auto; padding: 6px 0;
    background: var(--surface-card); color: var(--ink); border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow-raised); }
  .sugestao { display: flex; align-items: center; gap: 12px; padding: 8px 14px; color: var(--ink); text-decoration: none; min-height: 44px; }
  .sugestao:hover, .sugestao:focus { background: var(--surface-sutil); color: var(--ink); }
  .sugestao .capa { width: 36px; height: 36px; font-size: 13px; }
  .sugestao > div { min-width: 0; }
  .ver-todos-busca { justify-content: center; color: var(--brand); font-weight: 600; border-top: 1px solid var(--line); }
  .busca-ativa { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 8px 12px; border-radius: var(--radius-md); background: var(--brand-soft); }

  /* ---------- Página ---------- */
  main { max-width: 1200px; margin: 0 auto; padding: 32px 24px 64px; display: flex; flex-direction: column; gap: 24px; }
  main.estreito { max-width: 880px; }
  .titulo-pagina { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
  .titulo-pagina > div { display: flex; flex-direction: column; gap: 4px; }
  /* Edição do imóvel: o avatar fica ao lado do título (não em cima) */
  .titulo-pagina > .com-capa { flex-direction: row; align-items: center; gap: 16px; }
  .painel { background: var(--surface-card); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 20px 24px;
    display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .painel-topo { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .colunas { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; }
  .colunas > .larga { flex: 999 1 560px; }
  .colunas > .estreita { flex: 1 1 320px; }

  /* ---------- Botões ---------- */
  .pr-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px;
    font: 600 16px/1 var(--font-sans); border-radius: var(--radius-md); border: 2px solid var(--brand); cursor: pointer;
    text-decoration: none; white-space: nowrap; }
  .pr-btn--pri { background: var(--brand); color: var(--on-brand); }
  .pr-btn--pri:hover { color: var(--on-brand); filter: brightness(1.08); }
  .pr-btn--sec { background: transparent; color: var(--brand); }
  .pr-btn--acao { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .pr-btn--acao:hover { color: var(--on-accent); filter: brightness(1.05); }
  .pr-btn--perigo { background: transparent; border-color: var(--danger); color: var(--danger); }
  .pr-btn--texto { border-color: transparent; background: transparent; color: var(--brand); padding: 0 8px; }
  .pr-btn--pequeno { min-height: 36px; padding: 0 12px; font-size: 14px; }
  .pr-btn:disabled { opacity: .45; cursor: not-allowed; }
  .largo { width: 100%; }
  .acoes { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .acoes.fim { justify-content: flex-end; }

  /* ---------- Campos ---------- */
  .grade { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
  .grade > * { min-width: 0; } /* conteúdo comprido (nome de arquivo) não alarga a coluna */
  .pr-field { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; align-content: start; } /* a coluna nunca estica por causa de um nome comprido */
  .pr-field label { font: 600 14px/20px var(--font-sans); }
  .pr-field input, .pr-field select, .pr-field textarea, .campo-busca { min-height: 44px; width: 100%; padding: 10px 12px;
    font: 400 16px/24px var(--font-sans); color: var(--ink); background: var(--surface-card);
    border: 1.5px solid var(--line-strong); border-radius: var(--radius-md); }
  .pr-field input[readonly] { background: var(--surface-sutil); border-style: dashed; color: var(--ink-muted); }
  .pr-field small, .dica { font: 400 14px/20px var(--font-sans); color: var(--ink-muted); }
  .campo-invalido { border-color: var(--danger) !important; }
  .aviso-campo { font: 400 14px/20px var(--font-sans); color: var(--danger); }
  .campo-senha { position: relative; }
  .campo-senha input { padding-right: 48px; }
  .ver-senha { position: absolute; right: 2px; top: 2px; width: 44px; height: 40px; border: 0; background: none; color: var(--ink-muted); cursor: pointer; }
  .busca { position: relative; flex: 1 1 280px; max-width: 420px; }
  .busca svg { position: absolute; left: 12px; top: 12px; color: var(--ink-muted); }
  .campo-busca { padding-left: 40px; }

  /* ---------- Etiquetas de situação (cores por prazo) ---------- */
  .st { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: var(--radius-sm);
    font: 600 13px/18px var(--font-sans); white-space: nowrap; }
  .st::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .st--ok { background: var(--success-soft); color: var(--success); }
  .st--aviso { background: var(--warning-soft); color: var(--warning); }
  .st--vencido { background: var(--danger-soft); color: var(--danger); }
  .st--sem-prazo { background: transparent; color: var(--ink-muted); border: 1px solid var(--line); }
  .etiqueta { display: inline-block; padding: 2px 8px; border-radius: var(--radius-sm); font: 600 13px/18px var(--font-sans);
    background: var(--brand-soft); color: var(--brand); white-space: nowrap; }

  /* ---------- Filtros ---------- */
  /* Filtros um do lado do outro, dividindo a largura da tela */
  .filtros { display: flex; gap: 8px; flex-wrap: nowrap; }
  .filtros .filtro { flex: 1 1 0; min-width: 0; display: flex; align-items: center; justify-content: center; text-align: center; }
  .filtro { min-height: 44px; padding: 0 14px; border-radius: var(--radius-md); border: 1.5px solid var(--line-strong);
    background: var(--surface-card); color: var(--ink); font: 600 15px/1 var(--font-sans); cursor: pointer; }
  .filtro[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
  .filtro .mono { opacity: .75; margin-left: 4px; }

  /* ---------- Totais do painel ---------- */
  .totais { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
  .total { text-decoration: none; color: var(--ink); background: var(--surface-card); border: 1px solid var(--line);
    border-radius: var(--radius-md); padding: 16px 20px; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
  .total:hover { color: var(--ink); border-color: var(--line-strong); }
  .total b { font: 700 36px/40px var(--font-sans); }
  .total.ok b { color: var(--success); } .total.aviso b { color: var(--warning); } .total.vencido b { color: var(--danger); }

  /* ---------- Cartão de imóvel com o dia do prazo ---------- */
  .pr-card { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 16px;
    background: var(--surface-card); border: 1px solid var(--line); border-radius: var(--radius-md); color: var(--ink); text-decoration: none; }
  .pr-card:hover { color: var(--ink); border-color: var(--line-strong); }
  .pr-card__dia { text-align: center; border: 1.5px solid var(--line); border-radius: var(--radius-sm); padding: 2px 0; font-variant-numeric: tabular-nums; }
  .pr-card__dia b { display: block; font: 600 20px/24px var(--font-sans); }
  .pr-card__dia span { font: 500 11px/14px var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted); }
  .pr-card p { color: var(--ink-muted); font-size: 14px; line-height: 20px; }

  .cobrancas { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(320px, 100%), 1fr)); gap: 12px; }

  /* ---------- Histórico de inquilinos ---------- */
  .historico { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--line); padding-top: 12px; }
  .historico-item { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .historico-item:last-child { border-bottom: 0; }

  /* ---------- Mapa da localização ---------- */
  .mapa:empty { display: none; }
  .mapa { display: flex; flex-direction: column; gap: 8px; }
  .mapa iframe { width: 100%; height: 260px; border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--surface-sutil); }
  @media (max-width: 760px) { .mapa iframe { height: 220px; } }

  /* ---------- Painel e listas de cobranças ---------- */
  .titulo-secao { font: 600 18px/24px var(--font-sans); margin: 4px 0 -8px; }
  .totais--valores .total b { font-size: 28px; line-height: 34px; font-variant-numeric: tabular-nums; }
  .totais .total b { overflow-wrap: anywhere; }
  .lista-cobrancas { display: flex; flex-direction: column; }
  .cobranca { display: grid; grid-template-columns: 56px minmax(0, 1.4fr) minmax(0, 1fr) auto; gap: 12px 16px; align-items: center;
    padding: 12px 0; border-top: 1px solid var(--line); }
  .cobranca:first-child { border-top: 0; }
  .cobranca-imovel { color: var(--ink); text-decoration: none; }
  .cobranca-imovel:hover { color: var(--brand); }
  .cobranca-imovel .capa { width: 44px; height: 44px; font-size: 15px; }
  .cobranca-valor { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
  .cobranca-acoes { justify-content: flex-end; }
  .area-envio--pequena { min-height: 88px; }
  @media (max-width: 760px) {
    .cobranca { grid-template-columns: 48px minmax(0, 1fr); }
    .cobranca-valor, .cobranca-acoes { grid-column: 2; }
    .cobranca-acoes { justify-content: flex-start; }
  }

  /* ---------- Mapa geral dos imóveis ---------- */
  .mapa-geral { height: calc(100vh - 300px); height: calc(100dvh - 300px); min-height: 380px; border: 1px solid var(--line);
    border-radius: var(--radius-lg); overflow: hidden; background: var(--surface-sutil); z-index: 0; }
  .pin-imovel { background: none; border: 0; }
  .pin { width: 48px; height: 48px; border-radius: 50%; padding: 3px; background: var(--line-strong);
    box-shadow: 0 2px 6px rgba(13,18,24,.35); }
  .pin .capa { width: 42px; height: 42px; font-size: 14px; border: 2px solid #fff; }
  .pin--ok { background: var(--success); } .pin--aviso { background: var(--warning); } .pin--vencido { background: var(--danger); }
  .popup-imovel { display: flex; flex-direction: column; gap: 8px; font-family: var(--font-sans); }
  .popup-imovel .capa { width: 40px; height: 40px; font-size: 14px; }
  .popup-imovel .acoes .pr-btn { color: inherit; }
  .popup-imovel .acoes .pr-btn--pri { color: var(--on-brand); }
  .leaflet-container { font-family: var(--font-sans); }
  @media (max-width: 760px) { .mapa-geral { height: calc(100dvh - 330px); min-height: 320px; } }

  /* ---------- Foto de capa (bolinha ao lado do nome) ---------- */
  .com-capa { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .com-capa > div, .com-capa > b { min-width: 0; }
  .capa { width: 56px; height: 56px; flex: none; border-radius: 50%; object-fit: cover; border: 1px solid var(--line);
    background: var(--brand-soft); }
  .capa--iniciais { display: grid; place-items: center; color: var(--brand); font: 600 18px/1 var(--font-sans); letter-spacing: .02em; }
  .capa--grande { width: 96px; height: 96px; font-size: 32px; }
  .aviso-item .capa { width: 40px; height: 40px; font-size: 14px; }
  .foto .estrela { position: absolute; left: 4px; bottom: 4px; height: 30px; padding: 0 8px; border: 0; border-radius: 15px; cursor: pointer;
    background: rgba(13,18,24,.7); color: #fff; display: inline-flex; align-items: center; gap: 4px; font: 600 12px/1 var(--font-sans); }
  .foto.foto--capa { outline: 3px solid var(--brand); outline-offset: -3px; }
  .foto.foto--capa .estrela { background: var(--brand); color: var(--on-brand); }
  .foto.foto--capa .estrela svg { fill: currentColor; }

  /* ---------- Avisos ---------- */
  .aviso-item { display: grid; grid-template-columns: 12px 40px minmax(0, 1fr); align-items: start; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line);
    text-decoration: none; color: var(--ink); }
  .aviso-item:last-child { border-bottom: 0; }
  .aviso-item:hover { background: var(--surface-sutil); color: var(--ink); }
  .aviso-item .bolinha { width: 10px; height: 10px; margin-top: 7px; border-radius: 50%; }
  .aviso-item.vencido .bolinha { background: var(--danger); }
  .aviso-item.aviso .bolinha { background: var(--warning); }
  .aviso-item.lido { color: var(--ink-muted); }
  .aviso-item.lido .bolinha { background: var(--line-strong); }
  .aviso-item b { font-weight: 600; display: block; }
  .painel .aviso-item { padding: 12px 0; }

  .pr-alert { display: grid; grid-template-columns: 22px 1fr; gap: 12px; padding: 12px 16px; border-radius: var(--radius-md);
    border: 1.5px solid; font: 400 15px/22px var(--font-sans); color: var(--ink); }
  .pr-alert b { display: block; font-weight: 600; }
  .pr-alert__ic { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font: 700 13px/1 var(--font-mono); color: var(--surface-card); }
  .pr-alert--ok { background: var(--success-soft); border-color: var(--success); } .pr-alert--ok .pr-alert__ic { background: var(--success); }
  .pr-alert--atencao { background: var(--warning-soft); border-color: var(--warning); } .pr-alert--atencao .pr-alert__ic { background: var(--warning); }
  .pr-alert--info { background: var(--brand-soft); border-color: var(--brand); } .pr-alert--info .pr-alert__ic { background: var(--brand); }

  /* ---------- Tabela de imóveis (vira cartões no celular) ---------- */
  .caixa-tabela { background: var(--surface-card); border: 1px solid var(--line); border-radius: var(--radius-lg); overflow-x: auto; }
  .tabela { width: 100%; border-collapse: collapse; min-width: 960px; }
  .tabela th { text-align: left; padding: 10px 12px; background: var(--brand-soft); color: var(--brand);
    font: 500 12px/16px var(--font-mono); letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; }
  .tabela td { padding: 12px; border-top: 1px solid var(--line); vertical-align: middle; font-size: 15px; line-height: 22px; }
  .tabela td.data { font: 500 14px/20px var(--font-mono); white-space: nowrap; }
  .tabela tr.clicavel { cursor: pointer; }
  .tabela tr.clicavel:hover td { background: var(--surface-sutil); }
  .tabela .nome { font-weight: 600; }
  .lista-cartoes { display: none; flex-direction: column; gap: 12px; }
  .cartao-imovel { text-decoration: none; color: var(--ink); background: var(--surface-card); border: 1px solid var(--line);
    border-radius: var(--radius-md); padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
  .cartao-imovel:hover { color: var(--ink); }
  .cartao-imovel .linha { display: flex; justify-content: space-between; gap: 6px 8px; align-items: center; flex-wrap: wrap; }
  .cartao-imovel .linha > .com-capa { flex: 1 1 200px; min-width: 0; }
  .cartao-imovel .linha b { min-width: 0; }
  .legenda { display: flex; gap: 8px 16px; flex-wrap: wrap; align-items: center; font-size: 14px; color: var(--ink-muted); }
  .valor-aluguel { font: 600 14px/20px var(--font-sans); color: var(--ink); font-variant-numeric: tabular-nums; }
  .vazio { padding: 32px 16px; text-align: center; color: var(--ink-muted); }

  /* ---------- Anexos ---------- */
  .area-envio { min-height: 120px; width: 100%; border: 2px dashed var(--line-strong); border-radius: var(--radius-md); background: var(--surface-sutil);
    color: var(--brand); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; cursor: pointer;
    font: 600 16px/24px var(--font-sans); padding: 12px; text-align: center; }
  .area-envio:hover { border-color: var(--brand); }
  .area-envio span { font: 400 14px/20px var(--font-sans); color: var(--ink-muted); }
  .fotos { display: flex; gap: 8px; flex-wrap: wrap; }
  .foto { position: relative; width: 104px; height: 80px; border-radius: var(--radius-sm); overflow: hidden; background: var(--brand-soft);
    display: grid; place-items: center; font: 500 11px/1 var(--font-mono); color: var(--brand); }
  .foto img { width: 100%; height: 100%; object-fit: cover; cursor: pointer; }
  .foto .tirar { position: absolute; top: 4px; right: 4px; width: 28px; height: 28px; border-radius: 50%; border: 0; cursor: pointer;
    background: rgba(13,18,24,.7); color: #fff; display: grid; place-items: center; }
  .foto.nova { outline: 2px dashed var(--brand); outline-offset: -2px; }
  .arquivo { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border: 1px solid var(--line); border-radius: var(--radius-md); font-size: 14px; }
  .arquivo { flex-wrap: wrap; }
  .campo-renomear { flex: 1 1 160px; min-width: 0; min-height: 40px; padding: 6px 10px; font: 400 16px/24px var(--font-sans); color: var(--ink);
    background: var(--surface-card); border: 1.5px solid var(--line-strong); border-radius: var(--radius-md); }
  .arquivo .arquivo-nome { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .foto-carregando { width: 100%; height: 100%; border: 0; background: none; color: var(--brand); cursor: pointer;
    font: 500 11px/1 var(--font-mono); }

  /* ---------- Janela por cima da página (visualizador e enquadramento) ---------- */
  body.com-janela { overflow: hidden; }
  .janela-fundo { position: fixed; inset: 0; z-index: 40; background: rgba(13,18,24,.6); display: grid; place-items: center; padding: 16px; }
  /* A janela cabe na tela: o meio rola e o rodapé com os botões fica sempre à vista */
  .janela { width: min(520px, 100%); max-height: calc(100vh - 32px); max-height: calc(100dvh - 32px); overflow: hidden;
    background: var(--surface-card); border-radius: var(--radius-lg); box-shadow: var(--shadow-raised); display: flex; flex-direction: column; }
  .janela--larga { width: min(960px, 100%); }
  .janela-topo { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 20px; flex: none; }
  .janela-topo h2 { font-size: 18px; line-height: 24px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .botao-fechar { width: 44px; height: 44px; flex: none; border: 0; border-radius: var(--radius-md); background: var(--surface-sutil);
    color: var(--ink); cursor: pointer; display: grid; place-items: center; }
  .janela-corpo { display: flex; flex-direction: column; gap: 16px; padding: 0 20px 16px; overflow: auto; min-height: 0; }
  .janela-rodape { flex: none; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; padding: 12px 20px;
    border-top: 1px solid var(--line); background: var(--surface-card); }
  .visor { position: relative; display: grid; place-items: center; min-height: 240px; background: #0d1218; border-radius: var(--radius-md); }
  .visor-img { max-width: 100%; max-height: calc(100vh - 220px); max-height: calc(100dvh - 220px); object-fit: contain; display: block; }
  .visor .carregando { color: #fff; }
  .visor-seta { position: absolute; top: 50%; transform: translateY(-50%); width: 48px; height: 64px; border: 0; border-radius: var(--radius-md);
    background: rgba(255,255,255,.85); color: var(--ink); font: 600 36px/1 var(--font-sans); cursor: pointer; }
  .visor-seta.esquerda { left: 8px; } .visor-seta.direita { right: 8px; }
  .visor-nome { margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .paginas-pdf { display: flex; flex-direction: column; gap: 12px; background: var(--surface-sutil); padding: 12px; border-radius: var(--radius-md); }
  .paginas-pdf canvas { width: 100%; height: auto; background: #fff; box-shadow: var(--shadow-raised); }
  .recorte { position: relative; width: min(320px, 100%, 45vh); width: min(320px, 100%, 45dvh); aspect-ratio: 1; flex: none; margin: 0 auto; border-radius: var(--radius-md); overflow: hidden;
    background: var(--surface-sutil); display: grid; place-items: center; }
  .recorte canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  .recorte canvas:active { cursor: grabbing; }
  /* Escurece o que fica fora do círculo: só o de dentro vira a bolinha */
  .recorte-circulo { position: absolute; inset: 0; border-radius: 50%; box-shadow: 0 0 0 999px rgba(13,18,24,.55);
    outline: 2px solid #fff; outline-offset: -2px; pointer-events: none; }
  .pr-field input[type="range"] { padding: 0; border: 0; accent-color: var(--brand); }

  /* ---------- Login ---------- */
  .tela-login { max-width: 420px; margin: 48px auto; background: var(--surface-card); border: 1px solid var(--line); border-radius: var(--radius-lg);
    padding: 32px 28px; display: flex; flex-direction: column; gap: 16px; }
  .tela-login form { display: flex; flex-direction: column; gap: 16px; }
  .separador { display: flex; align-items: center; gap: 12px; color: var(--ink-muted); font-size: 14px; }
  .separador::before, .separador::after { content: ""; flex: 1; border-top: 1px solid var(--line); }

  /* ---------- Usuários ---------- */
  .usuario-linha { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .usuario-linha:first-child { border-top: 0; }
  .usuario-linha > div { flex: 1 1 220px; min-width: 0; }

  /* ---------- Carregando e mensagens ---------- */
  .carregando { padding: 64px 16px; text-align: center; color: var(--ink-muted); display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .girando { width: 32px; height: 32px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--brand); animation: girar 0.9s linear infinite; }
  @keyframes girar { to { transform: rotate(360deg); } }
  /* Fica entre 16px das bordas: nunca "empurra" a página para o lado (isso fazia o tablet afastar o zoom) */
  .mensagem { position: fixed; left: 16px; right: 16px; bottom: 24px; margin: 0 auto; width: fit-content; max-width: 640px; z-index: 50;
    background: var(--ink); color: var(--surface-bg); padding: 12px 20px; border-radius: var(--radius-md); box-shadow: var(--shadow-raised); }
  .mensagem.erro { background: var(--danger); color: #fff; }

  /* ---------- Listas e tabelas com altura fixa e rolagem interna (scroll container) ----------
   * O título do bloco e o cabeçalho da tabela ficam sempre à vista; rola-se só o conteúdo, dentro da caixa. */
  .rolagem { max-height: min(60vh, 560px); max-height: min(60dvh, 560px); overflow-y: auto; overscroll-behavior: contain;
    padding-right: 4px; scrollbar-width: thin; }
  .lista-prazos { display: flex; flex-direction: column; gap: 12px; padding-bottom: 2px; }
  .lista-cartoes.rolagem { max-height: calc(100vh - var(--altura-topo, 64px) - 260px); max-height: calc(100dvh - var(--altura-topo, 64px) - 260px); min-height: 240px; }
  /* Tabela de imóveis: a caixa tem altura fixa, rola por dentro (inclusive para o lado) e o cabeçalho gruda no alto da caixa */
  .caixa-tabela { max-height: calc(100vh - var(--altura-topo, 64px) - 240px); max-height: calc(100dvh - var(--altura-topo, 64px) - 240px);
    min-height: 260px; overflow: auto; overscroll-behavior: contain; }
  .tabela th { position: sticky; top: 0; z-index: 5; box-shadow: 0 1px 0 var(--line); }

  /* ---------- Tablet em pé (761 a 1023 px): a tabela não cabe, então vira cards em 2 colunas ---------- */
  @media (min-width: 761px) and (max-width: 1023px) {
    .caixa-tabela { display: none; }
    .lista-cartoes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); align-content: start; }
  }

  /* ---------- Celular e tablet em pé ---------- */
  @media (max-width: 760px) {
    .topo { padding: max(8px, env(safe-area-inset-top)) 16px 8px; }
    .topo-esq { gap: 8px; }
    .logo-topo { height: 30px; }
    /* Busca no celular: escondida; a lupa abre uma linha inteira embaixo do topo */
    .topo-busca { display: none; order: 3; flex: 1 1 100%; max-width: none; }
    .topo--buscando .topo-busca { display: block; }
    .so-computador { display: none !important; }
    .so-celular { display: inline-flex; }
    main { padding: 20px 16px 96px; gap: 20px; }
    h1 { font-size: 24px; line-height: 30px; }
    .caixa-tabela { display: none; }
    .lista-cartoes { display: flex; }
    .painel { padding: 16px; }
    .pr-card { grid-template-columns: 48px minmax(0, 1fr); }
    .pr-card > .st { grid-column: 2; justify-self: start; }
    .pr-card > .etiqueta { grid-column: 2; justify-self: start; }
    .pr-card { padding: 10px 12px; gap: 4px 12px; }
    .pr-card .capa { width: 48px; height: 48px; font-size: 16px; }
    .cartao-imovel .capa { width: 48px; height: 48px; font-size: 16px; }
    .capa--grande { width: 72px; height: 72px; font-size: 24px; }
    .pr-card h3 { font-size: 16px; line-height: 22px; }
    /* Totais: 2 por linha, compactos */
    .totais { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .total { padding: 12px 14px; gap: 4px; }
    .total b { font-size: 28px; line-height: 32px; }
    .total .st { font-size: 12px; padding: 2px 8px; }
    .titulo-pagina h1 { font-size: 22px; line-height: 28px; }
    /* Avisos: no painel, só os 3 primeiros (o resto fica no sininho) */
    /* Botões do fim do formulário: um embaixo do outro, Salvar primeiro */
    .acoes.fim { flex-direction: column-reverse; align-items: stretch; }
    .acoes.fim .pr-btn { width: 100%; margin-right: 0 !important; }
    /* Menu de baixo, estilo aplicativo */
    .menu-baixo { display: flex; }
    main { padding-bottom: 104px; }
    .mensagem { bottom: 88px; }
    .tela-login { margin: 16px auto; padding: 24px 20px; }
  }

  /* Celular: valores em reais inteiros (sem quebrar e sem vazar), etiquetas quebram a linha dentro do cartão.
     Fica no FIM do arquivo de propósito: no CSS, entre regras de mesmo peso, vale a última. */
  @media (max-width: 760px) {
    .totais--valores { gap: 10px; }
    .totais--valores .total { padding: 12px 10px; min-width: 0; }
    .totais--valores .total b { font-size: clamp(14px, 4.2vw, 20px); line-height: 26px; white-space: nowrap; overflow-wrap: normal; letter-spacing: -0.01em; }
    .total .st { white-space: normal; }
    /* Recebido ocupa a linha toda; A vencer e Vencido ficam lado a lado embaixo */
    .totais--valores { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .totais--valores > .total:first-child { grid-column: 1 / -1; }
    .totais--imoveis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .periodo-escolha { flex: 1 1 100%; }
    .periodo-datas .pr-field { flex: 1 1 130px; }
    .periodo-datas .pr-btn { flex: 1 1 100%; }
    /* Filtros da página Imóveis: todos numa linha, o nome em cima e o número embaixo */
    .filtro { flex-direction: column; justify-content: center; gap: 2px; padding: 6px 4px; min-height: 56px; font-size: 13px; line-height: 16px; }
    .filtro .mono { margin-left: 0; }
  }

  /* ---------- Telas sem rolagem da página (listas) ----------
     A altura do .tela-fixa vem do ajustarTelaFixa (App.html). O bloco .crescer ocupa o espaço que sobra
     e só a lista dentro dele rola: o título, os filtros e o cabeçalho da tabela ficam parados. */
  .tela-fixa { display: flex; flex-direction: column; gap: 24px; min-height: 0; }
  .tela-fixa > .crescer { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
  .tela-fixa .crescer > .caixa-tabela, .tela-fixa .crescer > .lista-cartoes, .tela-fixa .crescer > .rolagem,
  .tela-fixa .crescer > .lista-cobrancas { flex: 1 1 auto; min-height: 0; max-height: none; }
  .tela-fixa > .painel:not(.crescer) .rolagem { max-height: 30vh; }
  .tela-fixa--rola > .crescer { flex: none; }
  .tela-fixa--rola .crescer > .caixa-tabela, .tela-fixa--rola .crescer > .lista-cartoes,
  .tela-fixa--rola .crescer > .rolagem, .tela-fixa--rola .crescer > .lista-cobrancas { flex: none; max-height: 70vh; }
  /* No celular, a legenda (4 linhas) apertaria a lista; as etiquetas já dizem a situação por extenso */
  @media (max-width: 760px) { .tela-fixa { gap: 16px; } .tela-fixa .legenda { display: none; } }
  /* Tela baixa (ex.: notebook): a legenda também sai, para a lista ter mais espaço */
  @media (max-height: 820px) { .tela-fixa .legenda { display: none; } }
  /* Tela da categoria: o cartão do alto vira uma faixa baixa na largura toda (nome, valor e detalhe na mesma linha),
     o título da lista fica menor e as linhas mais juntas, para caber o máximo de itens na lista */
  .tela-fixa { gap: 16px; }
  .tela-fixa .voltar { margin: -8px 0 -8px -8px; }
  .cabecalho-categoria { max-width: none; }
  .cabecalho-categoria .total { flex-direction: row; flex-wrap: wrap; align-items: center; gap: 4px 16px; padding: 12px 20px; }
  .cabecalho-categoria .total b { font-size: 26px; line-height: 32px; }
  .tela-fixa > .crescer.painel { padding: 14px 20px; gap: 8px; }
  .tela-fixa > .crescer .painel-topo h2 { font-size: 18px; line-height: 24px; }
  .tela-fixa .cobranca { padding: 8px 0; }
  @media (max-width: 760px) {
    .cabecalho-categoria .total { gap: 2px 12px; padding: 10px 14px; }
    .cabecalho-categoria .total b { font-size: 22px; line-height: 28px; }
    .tela-fixa > .crescer.painel { padding: 12px 14px; }
    .tela-fixa > .crescer .painel-topo h2 { font-size: 16px; line-height: 22px; }
  }

  /* ---------- Tela principal sem rolagem ----------
     A altura do .painel-cheio vem do ajustarTelaFixa (App.html); aqui os cartões dividem essa altura.
     Os tamanhos usam vh (altura da tela) e vw (largura): em tela menor, tudo diminui junto. */
  .painel-cheio { display: flex; flex-direction: column; gap: clamp(8px, 1.8vh, 24px); min-height: 0; }
  .painel-cheio .relatorio { flex: 1 1 0; min-height: 0; gap: clamp(6px, 1.2vh, 12px); }
  .painel-cheio .titulo-secao { margin: 0; font-size: clamp(15px, 2.3vh, 18px); line-height: 1.25; }
  .painel-cheio .totais { flex: 1 1 0; min-height: 0; grid-auto-rows: minmax(0, 1fr); gap: clamp(8px, 1.4vh, 16px); }
  .painel-cheio .total { min-height: 0; overflow: hidden; justify-content: center;
    padding: clamp(6px, 1.3vh, 16px) clamp(10px, 2.4vw, 20px); gap: clamp(0px, .5vh, 6px); }
  .painel-cheio .total .rotulo { font-size: clamp(11px, 1.6vh, 13px); line-height: 1.2; }
  .painel-cheio .total b { font-size: clamp(20px, 5vh, 40px); line-height: 1.1; }
  .painel-cheio .totais--valores .total b { font-size: clamp(14px, min(4.6vw, 3.6vh), 30px); line-height: 1.15; white-space: nowrap; }
  .painel-cheio .total > span:not(.rotulo) { font-size: clamp(11px, 1.7vh, 14px); line-height: 1.3; }
  .painel-cheio .total .st { padding: 1px 8px; }
  .painel-cheio .periodo-escolha select { min-height: 44px; }
  .painel-cheio .totais--valores { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .painel-cheio .totais--imoveis { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  @media (max-width: 1023px) {
    .painel-cheio .totais--imoveis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 760px) {
    .painel-cheio .totais--valores { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  .tela-fixa--rola.painel-cheio .relatorio, .tela-fixa--rola.painel-cheio .totais { flex: none; }
  .tela-fixa--rola.painel-cheio .totais { grid-auto-rows: auto; }
  /* Quando algum cartão não cabe, o ajustarTelaFixa liga estas classes (uma de cada vez):
     --compacto: os cartões de imóveis ficam só com o nome e o número (o aviso "vence em breve" continua);
     --minimo: todos os cartões ficam só com o nome e o número. */
  .painel-cheio--compacto .totais--imoveis .total > span:not(.rotulo):not(.st--aviso) { display: none; }
  .painel-cheio--minimo .total > span:not(.rotulo) { display: none; }
</style>

<body>
  <header class="topo" id="topo">
    <div class="topo-esq">
      <a class="marca" href="#/"><img class="logo-topo" src="logo-branco.png" alt="Az Gestão"></a>
    </div>
  </header>

  <main id="tela">
    <div class="carregando"><div class="girando"></div>Carregando…</div>
  </main>

  <script>
    // Rede de segurança (JavaScript antigo, para rodar em qualquer navegador):
    // se o site der erro ao abrir ou não terminar de carregar, mostra o motivo e um botão
    // para recarregar, em vez de ficar em "Carregando…" para sempre.
    window.__errosDoSite = [];
    window.addEventListener('error', function (e) {

    ].forEach(([chave, buscar]) => {
      if (cache.memoria[chave] && cache.memoria[chave].fresco) return;
      buscarUmaVez(chave, buscar).then(d => { gravarCache(chave, d); cache.memoria[chave].fresco = true; }).catch(() => {});
    });
    carregarEstilo(LEAFLET + 'leaflet.min.css');
    carregarScript(LEAFLET + 'leaflet.min.js').catch(() => {});
  }

  // Lê os campos de um formulário: { NomeDoCampo: valor }
  function lerFormulario(id) {
    const dados = {};
    document.querySelectorAll(`#${id} [name]`).forEach(el => { dados[el.name] = el.value.trim(); });
    return dados;
  }

  /* ---------- Máscaras: CPF/CNPJ e telefone ----------
   * A pessoa digita só os números e o campo coloca pontos, barra, traço e parênteses. */
  const MASCARAS = {
    documento: { max: 14, exemplo: 'CPF ou CNPJ', formatar: d => d.length <= 11
      ? d.replace(/^(\d{3})(\d)/, '$1.$2').replace(/^(\d{3})\.(\d{3})(\d)/, '$1.$2.$3').replace(/\.(\d{3})(\d)/, '.$1-$2')
      : d.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{0,2}).*/, '$1.$2.$3/$4-$5') },
    telefone: { max: 11, exemplo: '(00) 00000-0000', formatar: d => d.length <= 2 ? d.replace(/^(\d+)/, '($1')
      : d.length <= 10 ? d.replace(/^(\d{2})(\d{0,4})(\d{0,4}).*/, (_, a, b, c) => `(${a}) ${b}${c ? '-' + c : ''}`)
      : d.replace(/^(\d{2})(\d{5})(\d{4}).*/, '($1) $2-$3') }
  };

  function mascara(tipo) {
    const m = MASCARAS[tipo];
    return ` data-mascara="${tipo}" inputmode="numeric" autocomplete="off" placeholder="${m.exemplo}" maxlength="18"`;
  }

  function aplicarMascara(campo) {
    const m = MASCARAS[campo.dataset.mascara];
    let d = campo.value.replace(/\D/g, '');
    if (campo.dataset.mascara === 'telefone' && d.length > 11 && d.startsWith('55')) d = d.slice(2);
    campo.value = m.formatar(d.slice(0, m.max));
    conferirDocumento(campo);
  }

  // CPF e CNPJ: confere os dígitos verificadores e avisa embaixo do campo (não impede salvar)
  function conferirDocumento(campo) {
    if (campo.dataset.mascara !== 'documento') return;
    const d = campo.value.replace(/\D/g, '');
    const completo = d.length === 11 || d.length === 14;
    const valido = !completo || (d.length === 11 ? cpfValido(d) : cnpjValido(d));
    let aviso = campo.parentElement.querySelector('.aviso-campo');
    if (valido) { if (aviso) aviso.remove(); campo.classList.remove('campo-invalido'); campo.removeAttribute('aria-invalid'); return; }
    if (!aviso) {
      aviso = document.createElement('small');
      aviso.className = 'aviso-campo';
      aviso.id = campo.id + '-erro';
      campo.insertAdjacentElement('afterend', aviso);
      campo.setAttribute('aria-describedby', aviso.id);
    }
    aviso.textContent = (d.length === 11 ? 'Este CPF' : 'Este CNPJ') + ' não existe. Confira os números.';
    campo.classList.add('campo-invalido');
    campo.setAttribute('aria-invalid', 'true');
  }

  function cpfValido(d) {
    if (/^(\d)\1{10}$/.test(d)) return false;
    const digito = n => { let soma = 0; for (let i = 0; i < n; i++) soma += d[i] * (n + 1 - i); const r = soma * 10 % 11; return r === 10 ? 0 : r; };
    return digito(9) === Number(d[9]) && digito(10) === Number(d[10]);
  }

  function cnpjValido(d) {
    if (/^(\d)\1{13}$/.test(d)) return false;
    const digito = n => {
      const pesos = n === 12 ? [5, 4, 3, 2, 9, 8, 7, 6, 5, 4, 3, 2] : [6, 5, 4, 3, 2, 9, 8, 7, 6, 5, 4, 3, 2];
      const r = pesos.reduce((s, p, i) => s + d[i] * p, 0) % 11;
      return r < 2 ? 0 : 11 - r;
    };
    return digito(12) === Number(d[12]) && digito(13) === Number(d[13]);
  }

  document.addEventListener('input', e => {
    const campo = e.target;
    if (!campo.dataset || !campo.dataset.mascara) return;
    // Apagar um ponto ou traço com a tecla de apagar: apaga também o número antes dele
    const antes = campo.dataset.digitos || '';
    if (e.inputType && e.inputType.startsWith('delete') && campo.value.replace(/\D/g, '') === antes) {
      campo.value = antes.slice(0, -1);
    }
    aplicarMascara(campo);
    campo.dataset.digitos = campo.value.replace(/\D/g, '');
  });

  /* =========================================================
   * Navegação: #/  #/imoveis  #/novo  #/imovel/ID  #/usuarios  #/usuario/ID
   * ========================================================= */
  function irPara(rota) {
    fecharFlutuantes();
    if (estado.mapaGeral) { estado.mapaGeral.remove(); estado.mapaGeral = null; } // saiu da aba Mapa
    if (!estado.usuario) return telaEntrar();
    const [caminho, busca] = String(rota || '').replace(/^#\/?/, '').split('?');
    const partes = caminho.split('/').filter(Boolean);
    desenharTopo(partes[0] || '');
    if (partes[0] === 'imoveis') return telaImoveis(new URLSearchParams(busca || '').get('f'));
    if (partes[0] === 'novo') return telaImovel(null);
    if (partes[0] === 'imovel' && partes[1]) return telaImovel(partes[1]);
    if (partes[0] === 'mapa') return telaMapa();
    if (partes[0] === 'usuarios') return telaUsuarios();
    if (partes[0] === 'usuario' && partes[1]) return telaEditarUsuario(partes[1]);
    const periodo = periodoDaRota(busca);
    if (partes[0] === 'categoria' && CATEGORIAS[partes[1]]) return telaCategoria(partes[1], periodo);
    return telaPainel(periodo);
  }

  window.addEventListener('hashchange', () => irPara(location.hash));

  function navegar(rota) {
    if (location.hash === rota) irPara(rota); else location.hash = rota;
  }

  /* =========================================================
   * Topo: menu, sininho e usuário
   * ========================================================= */
  function desenharTopo(paginaAtual) {
    const topo = document.getElementById('topo');
    const u = estado.usuario;
    const marca = `<a class="marca" href="#/"><img class="logo-topo" src="logo-branco.png" alt="Az Gestão – ir para o painel"></a>`;
    if (!u) { topo.innerHTML = `<div class="topo-esq">${marca}</div>`; desenharMenuBaixo(null); return; }
    const atual = p => (p === paginaAtual || (p === 'imoveis' && ['imovel', 'novo'].includes(paginaAtual))
      || (p === '' && paginaAtual === 'categoria')) ? ' aria-current="page"' : '';
    const admin = u.Nivel === 'Administrador' && !estado.demonstracao;
    const n = estado.avisos.naoLidos;
    // A estrutura do topo é montada uma vez; depois só o menu e os botões são redesenhados
    if (!document.getElementById('topo-busca')) {
      topo.innerHTML = `<div class="topo-esq" id="topo-esq"></div>
        <div class="topo-busca" id="topo-busca" role="search">
          <label for="busca-topo" class="sr">Buscar imóvel</label>${ICONE.lupa}
          <input id="busca-topo" type="search" placeholder="Buscar imóvel, endereço ou inquilino" autocomplete="off" spellcheck="false"
            role="combobox" aria-autocomplete="list" aria-controls="sugestoes-busca" aria-expanded="false"
            oninput="buscarNoTopo(this.value)" onfocus="buscarNoTopo(this.value)" onkeydown="teclaBusca(event)">
          <div id="sugestoes-busca" class="sugestoes" role="listbox" aria-label="Imóveis encontrados" hidden></div>
        </div>
        <div class="topo-dir" id="topo-dir"></div>`;
    }
    document.getElementById('topo-esq').innerHTML = `${marca}
        <nav class="menu so-computador" aria-label="Menu principal">
          <a href="#/"${atual('')}>Painel</a>
          <a href="#/imoveis"${atual('imoveis')}>Imóveis</a>
          <a href="#/mapa"${atual('mapa')}>Mapa</a>
          ${admin ? `<a href="#/usuarios"${atual('usuarios') || atual('usuario')}>Usuários${estado.pendentes ? ` <span class="contador">${estado.pendentes}</span>` : ''}</a>` : ''}
        </nav>`;
    document.getElementById('topo-dir').innerHTML = `
        <button class="botao-icone so-celular" onclick="abrirBuscaCelular()" aria-label="Buscar imóvel">${ICONE.lupa}</button>
        <a href="#/novo" class="pr-btn pr-btn--acao so-computador">+ Incluir imóvel</a>
        <button class="botao-icone" id="botao-sino" onclick="alternarAvisos(event)" aria-haspopup="true" aria-expanded="false"
          aria-label="Avisos${n ? ': ' + n + (n === 1 ? ' novo' : ' novos') : ''}">${ICONE.sino}${n ? `<span class="contador">${n}</span>` : ''}</button>
        <button class="avatar" onclick="alternarMenuUsuario(event)" aria-haspopup="true" aria-label="Menu de ${esc(u.Nome)}" title="${esc(u.Nome)}">${esc(iniciais(u.Nome))}</button>`;
    desenharMenuBaixo(atual, admin);
  }

  /* ---------- Busca no cabeçalho ----------
   * Na página de Imóveis, filtra a lista enquanto digita. Nas outras, mostra sugestões (autocomplete):
   * tocar numa abre o imóvel; Enter abre a lista de imóveis filtrada. Usa a cópia da lista (cache). */
  function imoveisParaBusca() {
    const guardado = lerCache('imoveis');
    if (guardado) return guardado.dados.imoveis;
    buscarUmaVez('imoveis', () => chamar('listarImoveis', auth()))
      .then(d => { gravarCache('imoveis', d); const c = document.getElementById('busca-topo'); if (c && document.activeElement === c) buscarNoTopo(c.value); })
      .catch(() => {});
    return null;
  }

  function filtrarImoveis(lista, termo) {
    const t = semAcento(termo).trim();
    return lista.filter(i => !t || semAcento([i.Nome, i.Localizacao, i.Inquilino].join(' ')).includes(t));
  }

  function buscarNoTopo(termo) {
    estado.busca = termo;
    if (paginaAtual() === 'imoveis' && document.getElementById('resultados')) {
      fecharSugestoes();
      return desenharResultados();
    }
    const caixa = document.getElementById('sugestoes-busca');
    if (!termo.trim()) return fecharSugestoes();
    const lista = imoveisParaBusca();
    caixa.hidden = false;
    document.getElementById('busca-topo').setAttribute('aria-expanded', 'true');
    if (!lista) { caixa.innerHTML = '<p class="vazio pequeno">Buscando…</p>'; return; }
    const achados = filtrarImoveis(lista, termo);
    caixa.innerHTML = achados.length ? achados.slice(0, 6).map(i => `
      <a class="sugestao" role="option" href="#/imovel/${esc(i.ID_Imovel)}" onclick="escolherSugestao()">${avatarImovel(i.Nome, i.Capa)}
        <div><b>${esc(i.Nome)}</b><div class="suave pequeno">${esc([i.Localizacao, i.Inquilino].filter(Boolean).join(' · '))}</div></div></a>`).join('')
      + (achados.length > 6 ? `<a class="sugestao ver-todos-busca" role="option" href="#/imoveis" onclick="fecharSugestoes()">Ver todos os ${achados.length} resultados</a>` : '')
      : '<p class="vazio pequeno">Nenhum imóvel encontrado.</p>';
  }

  function escolherSugestao() {
    const campo = document.getElementById('busca-topo');
    campo.value = ''; estado.busca = '';
    fecharSugestoes();
    document.getElementById('topo').classList.remove('topo--buscando');
  }

  function fecharSugestoes() {
    const caixa = document.getElementById('sugestoes-busca');
    if (caixa) { caixa.hidden = true; caixa.innerHTML = ''; }
    const campo = document.getElementById('busca-topo');
    if (campo) campo.setAttribute('aria-expanded', 'false');
  }

  function teclaBusca(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      fecharSugestoes();
      estado.busca = e.target.value;
      document.getElementById('topo').classList.remove('topo--buscando');
      return navegar('#/imoveis');
    }
    if (e.key === 'Escape') { fecharSugestoes(); e.target.blur(); }
    if (e.key === 'ArrowDown') {
      const primeira = document.querySelector('#sugestoes-busca .sugestao');
      if (primeira) { e.preventDefault(); primeira.focus(); }
    }
  }

  // Celular: a busca fica escondida e aparece embaixo do topo ao tocar na lupa
  function abrirBuscaCelular() {
    const topo = document.getElementById('topo');
    topo.classList.toggle('topo--buscando');
    if (topo.classList.contains('topo--buscando')) document.getElementById('busca-topo').focus();
  }

  document.addEventListener('click', e => { if (!e.target.closest('.topo-busca')) fecharSugestoes(); });

  // Altura do topo numa variável CSS: o cabeçalho fixo da tabela gruda logo abaixo dele
  if (window.ResizeObserver) {
    new ResizeObserver(() => {
      const topo = document.getElementById('topo');
      if (topo) document.documentElement.style.setProperty('--altura-topo', topo.offsetHeight + 'px');
      ajustarTelaFixa(); // o topo mudou de altura (ex.: a busca abriu no celular): refaz a altura da tela fixa
    }).observe(document.getElementById('topo'));
  }

  // Celular: menu fixo no rodapé, perto do polegar (no tablet e no computador fica escondido)
  function desenharMenuBaixo(atual, admin) {
    let menu = document.getElementById('menu-baixo');
    if (!atual) { if (menu) menu.remove(); return; }
    if (!menu) {
      menu = document.createElement('nav');
      menu.id = 'menu-baixo';
      menu.className = 'menu-baixo';
      menu.setAttribute('aria-label', 'Menu');
      document.body.appendChild(menu);
    }
    menu.innerHTML = `
      <a href="#/"${atual('')}>${ICONE.casa}<span>Painel</span></a>
      <a href="#/imoveis"${atual('imoveis')}>${ICONE.lista}<span>Imóveis</span></a>
      <a href="#/novo" class="incluir">${ICONE.mais}<span>Incluir</span></a>
      <a href="#/mapa"${atual('mapa')}>${ICONE.mapa}<span>Mapa</span></a>
      ${admin ? `<a href="#/usuarios"${atual('usuarios') || atual('usuario')}>${ICONE.pessoas}<span>Usuários</span>${estado.pendentes ? `<span class="contador">${estado.pendentes}</span>` : ''}</a>` : ''}`;
  }

  function fecharFlutuantes() {
    document.querySelectorAll('.flutuante').forEach(f => f.remove());
    const sino = document.getElementById('botao-sino');
    if (sino) sino.setAttribute('aria-expanded', 'false');
  }

  document.addEventListener('click', e => {
    if (!e.target.closest('.flutuante') && !e.target.closest('#botao-sino') && !e.target.closest('.avatar')) fecharFlutuantes();
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') fecharFlutuantes(); });

  function textoAviso(a) {
    if (a.tipo === 'vencido') {
      const qtd = a.qtdAtrasadas > 1 ? `${a.qtdAtrasadas} aluguéis atrasados` : 'o aluguel atrasado';
      return { titulo: 'Aluguel atrasado', texto: `${a.nome} está com ${qtd} desde ${dataBR(a.prazo)}${a.valorAtrasado ? ` (${dinheiro(a.valorAtrasado)})` : ''}.` };
    }
    return { titulo: 'Vencimento chegando', texto: `${a.nome} vence em ${dataBR(a.prazo)}${a.dias === 0 ? ' (hoje)' : a.dias === 1 ? ' (amanhã)' : ` (em ${a.dias} dias)`}.` };
  }


  function itemAviso(a) {
    const t = textoAviso(a);
    return `<a class="aviso-item ${a.tipo}${a.lido ? ' lido' : ''}" href="#/imovel/${esc(a.ID_Imovel)}">
      <span class="bolinha" aria-hidden="true"></span>${avatarImovel(a.nome, a.capa)}
      <div><b>${esc(t.titulo)}${a.lido ? '' : ' <span class="sr">(novo)</span>'}</b>${esc(t.texto)}</div></a>`;
  }

  function alternarAvisos(evento) {
    evento.stopPropagation();
    const aberto = document.getElementById('painel-avisos');
    fecharFlutuantes();
    if (aberto) return;
    const av = estado.avisos;
    const div = document.createElement('div');
    div.className = 'flutuante';
    div.id = 'painel-avisos';
    div.setAttribute('role', 'dialog');
    div.setAttribute('aria-label', 'Avisos');
    div.innerHTML = `
      <div class="flutuante-topo"><h3>Avisos</h3>
        ${av.naoLidos ? `<button class="pr-btn pr-btn--texto pr-btn--pequeno" onclick="marcarTodosLidos()">Marcar como lidos</button>` : ''}</div>
      ${av.lista.length ? av.lista.map(itemAviso).join('') : '<p class="vazio">Nenhum aluguel atrasado ou vencendo. Tudo em dia!</p>'}`;
    document.body.appendChild(div);
    document.getElementById('botao-sino').setAttribute('aria-expanded', 'true');
  }

  async function marcarTodosLidos() {
    try {
      estado.avisos = await chamar('marcarAvisosLidos', estado.avisos.lista.filter(a => !a.lido).map(a => a.chave), auth());
      fecharFlutuantes();
      desenharTopo(paginaAtual());
    } catch (erro) { mostrarErro(erro); }
  }

  function paginaAtual() {
    return location.hash.replace(/^#\/?/, '').split(/[/?]/)[0];
  }

  async function atualizarAvisos() {
    try {
      estado.avisos = await chamar('listarAvisos', auth());
      desenharTopo(paginaAtual());
    } catch (e) { /* o sininho fica como estava */ }
  }

  function alternarMenuUsuario(evento) {
    evento.stopPropagation();
    const aberto = document.getElementById('menu-usuario');
    fecharFlutuantes();
    if (aberto) return;
    const u = estado.usuario;
    const div = document.createElement('div');
    div.className = 'flutuante menu-usuario';
    div.id = 'menu-usuario';
    div.innerHTML = `
      <div class="flutuante-topo"><div><b>${esc(u.Nome)}</b><div class="suave pequeno">${esc(estado.demonstracao ? 'Demonstração' : u.Email)} · ${esc(u.Nivel)}</div></div></div>
      ${appInstalado() ? '' : '<button onclick="instalarApp()">Instalar o app neste aparelho</button>'}
      <button onclick="sairDoSistema()">Sair</button>`;
    document.body.appendChild(div);
  }

  /* =========================================================
   * Login e sessão
   * ========================================================= */
  function auth() { return estado.auth; }

  function lerLocal(chave) { try { return localStorage.getItem(chave) || ''; } catch (e) { return ''; } }
  function gravarLocal(chave, valor) {
    try { valor ? localStorage.setItem(chave, valor) : localStorage.removeItem(chave); } catch (e) {}
  }

  async function iniciar() {
    estado.auth = { token: lerLocal('tokenSessao') };
    // Já entrou antes neste aparelho: mostra a última versão guardada na hora, enquanto o servidor confere o login
    const ultimo = estado.auth.token && lerLocal('ultimoUsuario');
    if (ultimo) {
      try {
        estado.usuario = JSON.parse(ultimo);
        irPara(location.hash);
      } catch (e) { estado.usuario = null; carregando(); }
    } else carregando();
    try {
      await tratarSituacao(await chamar('iniciarSessao', estado.auth.token));
    } catch (erro) {
      tela(`<div class="tela-login"><h1>Não foi possível carregar</h1>
        <p class="suave">${esc(erro.message || erro)}</p>
        <button class="pr-btn pr-btn--pri largo" onclick="iniciar()">Tentar de novo</button></div>`);
    }
  }

  async function tratarSituacao(r) {
    if (r.token) { estado.auth.token = r.token; gravarLocal('tokenSessao', r.token); }
    estado.usuario = null;
    desenharTopo();
    if (r.situacao !== 'Ativo') { gravarLocal('ultimoUsuario', ''); limparCache(); }
    if (r.situacao === 'sem-login') return telaEntrar();
    if (r.situacao === 'Pendente') return telaAvisoAcesso('Cadastro aguardando aprovação',
      'Seu cadastro foi enviado. Assim que o administrador aprovar, você recebe um e-mail e já pode usar o portal.');
    if (r.situacao === 'Recusado') return telaAvisoAcesso('Cadastro não aprovado', 'Fale com o administrador do portal.');
    if (r.situacao === 'Inativo') return telaAvisoAcesso('Acesso desativado', 'Fale com o administrador do portal.');

    const jaMostrando = estado.usuario && estado.usuario.Email === r.usuario.Email && document.querySelector('#tela > :not(.carregando)');
    estado.usuario = r.usuario;
    estado.demonstracao = !!r.demonstracao;
    estado.pendentes = r.pendentes || 0;
    gravarLocal('ultimoUsuario', JSON.stringify(r.usuario));
    if (jaMostrando) desenharTopo(paginaAtual()); // a tela já está aberta (cópia guardada) e se atualiza sozinha
    else irPara(location.hash);
    atualizarAvisos();
    adiantarTelas();
  }

  async function sairDoSistema() {
    fecharFlutuantes();
    try { await chamar('sair', estado.auth.token); } catch (e) {}
    encerrarSessaoLocal();
    telaEntrar();
  }

  function encerrarSessaoLocal() {
    limparCache();
    gravarLocal('ultimoUsuario', '');
    gravarLocal('tokenSessao', '');
    estado.auth = { token: '' };
    estado.usuario = null;
    estado.avisos = { lista: [], naoLidos: 0 };
    desenharTopo();
  }

  function campoSenha(id, rotulo, auto) {
    return `<div class="pr-field"><label for="${id}">${rotulo}</label>
      <div class="campo-senha"><input id="${id}" type="password" minlength="${auto === 'current-password' ? 1 : 6}" required autocomplete="${auto}">
      <button type="button" class="ver-senha" onclick="alternarSenha('${id}', this)" aria-label="Mostrar senha">${ICONE.olho}</button></div></div>`;
  }

  function alternarSenha(id, botao) {
    const campo = document.getElementById(id);
    const mostrar = campo.type === 'password';
    campo.type = mostrar ? 'text' : 'password';
    botao.innerHTML = mostrar ? ICONE.olhoFechado : ICONE.olho;
    botao.setAttribute('aria-label', mostrar ? 'Esconder senha' : 'Mostrar senha');
    campo.focus();
  }

  function telaEntrar() {
    desenharTopo();
    tela(`
      <div class="tela-login">
        <img class="logo-login" src="logo-azul.png" alt="Az Gestão"><h1>Entrar</h1>
        <form id="form-entrar" onsubmit="event.preventDefault(); fazerLogin()">
          <div class="pr-field"><label for="login-email">E-mail</label>
            <input id="login-email" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required value="${esc(estado.loginEmail || lerLocal('ultimoEmail'))}"></div>
          ${campoSenha('login-senha', 'Senha', 'current-password')}
          <button class="pr-btn pr-btn--pri largo" id="btn-entrar">Entrar</button>
        </form>
        <div class="separador">Ainda não tem acesso?</div>
        <button class="pr-btn pr-btn--sec largo" onclick="telaCadastro()">Pedir acesso</button>
        <p class="suave pequeno">Esqueceu a senha? Fale com o administrador do portal.</p>
      </div>`, true);
    document.getElementById(document.getElementById('login-email').value ? 'login-senha' : 'login-email').focus();
  }

  async function fazerLogin() {
    const email = document.getElementById('login-email').value.trim();
    const botao = document.getElementById('btn-entrar');
    botao.disabled = true; botao.textContent = 'Entrando…';
    try {
      const r = await chamar('entrar', email, document.getElementById('login-senha').value);
      estado.loginEmail = email; gravarLocal('ultimoEmail', email);
      await tratarSituacao(r);
    } catch (erro) {
      mostrarErro(erro);
      botao.disabled = false; botao.textContent = 'Entrar';
    }
  }

  function telaCadastro() {
    tela(`
      <div class="tela-login">
        <img class="logo-login" src="logo-azul.png" alt="Az Gestão"><h1>Pedir acesso</h1>
        <p class="suave">Depois de enviar, o administrador confere o seu cadastro e libera o acesso.</p>
        <form id="form-cadastro" onsubmit="event.preventDefault(); enviarCadastro()">
          <div class="pr-field"><label for="cad-nome">Nome completo</label><input id="cad-nome" required autocomplete="name"></div>
          <div class="pr-field"><label for="cad-email">E-mail</label><input id="cad-email" type="email" required autocomplete="email"></div>
          <div class="pr-field"><label for="cad-tel">Telefone</label><input id="cad-tel" type="tel"${mascara('telefone')}></div>
          ${campoSenha('cad-senha', 'Senha (mínimo 6 caracteres)', 'new-password')}
          ${campoSenha('cad-senha2', 'Repita a senha', 'new-password')}
          <button class="pr-btn pr-btn--pri largo" id="btn-cadastrar">Enviar pedido</button>

  async function enviarCadastro() {
    const senha = document.getElementById('cad-senha').value;
    if (senha !== document.getElementById('cad-senha2').value) return mostrarMensagem('As senhas não são iguais.', 'erro');

        Nome: document.getElementById('cad-nome').value.trim(), Email: email,

      });
      estado.loginEmail = email; gravarLocal('ultimoEmail', email);
      await tratarSituacao(r);
    } catch (erro) {
      mostrarErro(erro);
      botao.disabled = false; botao.textContent = 'Enviar pedido';
    }
