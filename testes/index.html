      </form>`, true);
    document.querySelectorAll('#form-imovel [data-mascara]').forEach(c => { c.dataset.digitos = c.value.replace(/\D/g, ''); conferirDocumento(c); });
    desenharAnexos();
    atualizarCobranca();
    if (novo) document.getElementById('f-Nome').focus();
  }

  // Mostra ou esconde os campos de cobrança e calcula as próximas datas na hora
  function atualizarCobranca() {
    const sim = document.getElementById('f-Cobrar').value === 'Sim';
    document.querySelectorAll('.so-cobranca').forEach(el => { el.hidden = !sim; });
    if (!sim) return;
    const tipo = document.getElementById('f-TipoCobranca').value;
    const inicio = document.getElementById('f-InicioCobranca').value;
    document.getElementById('dica-tipo').textContent = tipo === 'A cada 30 dias'
      ? 'Conta 30 dias corridos: o dia do mês vai mudando.'
      : 'Sempre no mesmo dia. Em mês mais curto, cai no último dia.';
    const previa = document.getElementById('previa-cobranca');
    if (!inicio) {
      previa.innerHTML = `<span class="pr-alert__ic">${ICONE.agenda}</span><div><b>Próxima cobrança</b>Escolha o dia em que a cobrança começa.</div>`;
      return;
    }
    const hoje = hojeISO();
    const datas = [proximaCobranca(tipo, inicio, hoje)];
    for (let n = 0; n < 2; n++) datas.push(proximaCobranca(tipo, inicio, somarDias(datas[datas.length - 1], 1)));
    const valor = lerValor(document.getElementById('f-ValorAluguel').value);
    previa.innerHTML = `<span class="pr-alert__ic">${ICONE.agenda}</span><div>
      <b>Próxima cobrança: ${dataComDia(datas[0])} (${quandoCobrar(diasEntre(hoje, datas[0])).toLowerCase()})${valor ? ' · ' + esc(dinheiro(valor)) : ''}</b>
      Depois: ${datas.slice(1).map(dataBR).join(' e ')}.
      ${Number.isNaN(valor) ? '<br><span class="aviso-campo">Valor inválido. Use, por exemplo, 1.500,00.</span>' : ''}</div>`;
  }

  function formatarValor(campo) {
    const v = lerValor(campo.value);
    if (v !== '' && !Number.isNaN(v)) campo.value = v.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function desenharAnexos() {
    const f = estado.form;
    const i = f.imovel || { Fotos: [] };
    const ehCapa = foto => !!f.capa && (f.capa.foto ? f.capa.foto === foto : f.capa.url === foto.url);
    const botaoCapa = (foto, chamada) => `<button type="button" class="estrela" onclick="${chamada}" aria-pressed="${ehCapa(foto)}"
        aria-label="${ehCapa(foto) ? 'Ajustar ou tirar a foto de perfil' : 'Usar como foto de perfil'}">${ICONE.estrela}Perfil</button>`;
    const fotosSalvas = i.Fotos.map((foto, n) => `
      <div class="foto${ehCapa(foto) ? ' foto--capa' : ''}">
        ${estado.miniaturas[foto.url]
          ? `<img src="${estado.miniaturas[foto.url]}" alt="${esc(foto.nome)}" onclick="verFoto(${n})">`
          : `<button type="button" class="foto-carregando" data-miniatura="${esc(foto.url)}" onclick="verFoto(${n})" aria-label="Ver ${esc(foto.nome)}">FOTO</button>`}
        <button type="button" class="tirar" onclick="tirarFotoSalva('${esc(foto.url)}')" aria-label="Remover a foto ${esc(foto.nome)}">${ICONE.x}</button>
        ${botaoCapa(foto, `escolherCapa('salva', ${n})`)}
      </div>`).join('');
    const fotosNovas = f.fotosNovas.map((foto, n) => `
      <div class="foto nova${ehCapa(foto) ? ' foto--capa' : ''}" title="Será enviada ao salvar">
        <img src="${foto.previa}" alt="Foto nova: ${esc(foto.arquivo.name)}" onclick="verFoto(${i.Fotos.length + n})">
        <button type="button" class="tirar" onclick="tirarFotoNova(${n})" aria-label="Não enviar ${esc(foto.arquivo.name)}">${ICONE.x}</button>
        ${botaoCapa(foto, `escolherCapa('nova', ${n})`)}
      </div>`).join('');
    const linhaArquivo = (nome, extra, acoes) => f.renomeando ? `
      <div class="arquivo renomear">
        <label for="novo-nome-contrato" class="sr">Novo nome do contrato</label>
        <input id="novo-nome-contrato" class="campo-renomear" onkeydown="if (event.key === 'Enter') { event.preventDefault(); salvarNomeContrato(); }" value="${esc(nomeLegivel(nome).replace(/\.pdf$/i, '').replace(/\uFFFD/g, ''))}" maxlength="120" autocomplete="off">
        <span class="suave pequeno">.pdf</span>
        <button type="button" class="pr-btn pr-btn--pri pr-btn--pequeno" id="btn-nome-contrato" onclick="salvarNomeContrato()">Salvar nome</button>
        <button type="button" class="pr-btn pr-btn--texto pr-btn--pequeno" onclick="estado.form.renomeando = false; desenharAnexos()">Cancelar</button>
      </div>` : `
      <div class="arquivo">${ICONE.arquivo}<span class="arquivo-nome" title="${esc(nomeLegivel(nome))}">${esc(nomeLegivel(nome))}</span>${extra}
        <button type="button" class="pr-btn pr-btn--texto pr-btn--pequeno" onclick="estado.form.renomeando = true; desenharAnexos(); document.getElementById('novo-nome-contrato').select()"
          aria-label="Renomear o contrato" title="Renomear">${ICONE.lapis}</button>
        <button type="button" class="pr-btn pr-btn--sec pr-btn--pequeno" onclick="verContrato()">Ver</button>${acoes}</div>`;
    const contratoSalvo = i.ContratoUrl && !f.contratoNovo ? linhaArquivo(i.ContratoNome || 'contrato.pdf', '',
      `<button type="button" class="pr-btn pr-btn--texto pr-btn--pequeno" onclick="tirarContratoSalvo()" aria-label="Remover o contrato">${ICONE.x}</button>`) : '';
    const contratoNovo = f.contratoNovo ? linhaArquivo(f.contratoNovo.name, '<span class="etiqueta" style="flex:none">Novo</span>',
      `<button type="button" class="pr-btn pr-btn--texto pr-btn--pequeno" onclick="estado.form.contratoNovo = null; desenharAnexos()" aria-label="Não enviar o contrato">${ICONE.x}</button>`) : '';

    document.getElementById('anexos').innerHTML = `
      <div class="pr-field">
        <span style="font:600 14px/20px var(--font-sans)">Fotos do imóvel</span>
        <label class="area-envio" for="campo-fotos">${ICONE.foto}Escolher fotos<span>Pode tirar na hora pelo tablet ou celular</span></label>
        <input id="campo-fotos" type="file" accept="image/*,.heic,.heif" multiple class="sr" onchange="escolherFotos(this)">
        ${fotosSalvas || fotosNovas ? `<div class="fotos">${fotosSalvas}${fotosNovas}</div>` : ''}
        ${fotosSalvas || fotosNovas ? '<small>Toque numa foto para ver grande. Toque em <b>Perfil</b> para escolher e enquadrar a foto de perfil do imóvel, que aparece ao lado do nome.</small>' : ''}
        ${f.fotosNovas.length ? `<small>${f.fotosNovas.length === 1 ? 'A foto com borda laranja é enviada' : 'As fotos com borda laranja são enviadas'} ao salvar.</small>` : ''}
      </div>
      <div class="pr-field">
        <span style="font:600 14px/20px var(--font-sans)">Contrato (PDF)</span>
        <label class="area-envio" for="campo-contrato">${ICONE.pdf}${i.ContratoUrl || f.contratoNovo ? 'Trocar contrato' : 'Enviar contrato'}<span>Fica guardado no Google Drive</span></label>
        <input id="campo-contrato" type="file" accept="application/pdf" class="sr" onchange="escolherContrato(this)">
        ${contratoSalvo}${contratoNovo}
      </div>`;
    carregarMiniaturas();
  }

  // Nomes como "Contrato%20s%C3%A9rie.pdf" ficam legíveis ("Contrato série.pdf") quando dá
  function nomeLegivel(nome) {
    try { return decodeURIComponent(String(nome)); } catch (e) { return String(nome); }
  }

  /* ---------- Fotos HEIC (câmera de muitos celulares) ----------
   * O navegador não mostra HEIC. Ao escolher, a foto é convertida para JPG no próprio aparelho. */
  function ehHeic(arquivo) {
    return /image\/hei[cf]/i.test(arquivo.type) || /\.hei[cf]$/i.test(arquivo.name);
  }

  async function converterHeic(blob, nome) {
    await carregarScript('https://cdnjs.cloudflare.com/ajax/libs/heic2any/0.0.4/heic2any.min.js');
    let jpg = await heic2any({ blob, toType: 'image/jpeg', quality: 0.85 });
    if (Array.isArray(jpg)) jpg = jpg[0]; // fotos "ao vivo" vêm com várias imagens: fica a primeira
    return new File([jpg], String(nome || 'foto').replace(/\.\w+$/, '') + '.jpg', { type: 'image/jpeg' });
  }

  async function escolherFotos(campo) {
    const arquivos = [...campo.files];
    campo.value = '';
    for (let arquivo of arquivos) {
      const heic = ehHeic(arquivo);
      if (!heic && !arquivo.type.startsWith('image/')) { mostrarMensagem(`${arquivo.name} não é uma foto.`, 'erro'); continue; }
      if (heic) {
        mostrarAvisoFixo(`Convertendo ${arquivo.name} para JPG…`);
        try { arquivo = await converterHeic(arquivo, arquivo.name); } catch (e) {
          document.getElementById('progresso-envio')?.remove();
          mostrarMensagem(`Não deu para converter ${arquivo.name}. Tente tirar a foto em JPG.`, 'erro');
          continue;
        }
      }
      estado.form.fotosNovas.push({ arquivo, previa: URL.createObjectURL(arquivo) });
    }
    document.getElementById('progresso-envio')?.remove();
    desenharAnexos();
  }

  function tirarFotoNova(n) {
    const f = estado.form;
    const [foto] = f.fotosNovas.splice(n, 1);
    if (foto) URL.revokeObjectURL(foto.previa);
    // Era a capa escolhida: volta para a capa que já estava salva (se tinha)
    if (f.capa && f.capa.foto === foto) f.capa = f.imovel && f.imovel.CapaUrl ? { url: f.imovel.CapaUrl } : null;
    desenharAnexos();
  }

  // Endereço para mostrar uma foto salva no Drive (baixa uma vez e guarda; HEIC antigo vira JPG)
  async function enderecoDaFoto(url) {
    if (estado.miniaturas[url]) return estado.miniaturas[url];
    const a = await chamar('baixarArquivo', url, auth());
    let blob = base64ParaBlob(a.base64, a.tipo);
    if (/hei[cf]/i.test(a.tipo) || /\.hei[cf]$/i.test(a.nome)) blob = await converterHeic(blob, a.nome);
    return (estado.miniaturas[url] = URL.createObjectURL(blob));
  }

  /* ---------- Janela por cima da página (visualizador e enquadramento) ---------- */
  function abrirJanela(titulo, conteudo, classe, rodape) {
    fecharJanela();
    const fundo = document.createElement('div');
    fundo.className = 'janela-fundo';
    fundo.id = 'janela';
    fundo.innerHTML = `<div class="janela ${classe || ''}" role="dialog" aria-modal="true" aria-labelledby="janela-titulo">
      <div class="janela-topo"><h2 id="janela-titulo">${titulo}</h2>
        <button type="button" class="botao-fechar" onclick="fecharJanela()" aria-label="Fechar">${ICONE.x}</button></div>
      <div class="janela-corpo">${conteudo}</div>${rodape ? `<div class="janela-rodape">${rodape}</div>` : ''}</div>`;
    fundo.addEventListener('click', e => { if (e.target === fundo) fecharJanela(); });
    document.body.appendChild(fundo);
    document.body.classList.add('com-janela');
    fundo.querySelector('.botao-fechar').focus();
    return fundo;
  }

  function fecharJanela() {
    const j = document.getElementById('janela');
    if (j) { j.remove(); if (estado.aoFecharJanela) estado.aoFecharJanela(); }
    estado.aoFecharJanela = null;
    document.body.classList.remove('com-janela');
  }

  document.addEventListener('keydown', e => {
    if (!document.getElementById('janela')) return;
    if (e.key === 'Escape') fecharJanela();
    if (estado.visor && e.key === 'ArrowRight') verFoto(estado.visor.n + 1);
    if (estado.visor && e.key === 'ArrowLeft') verFoto(estado.visor.n - 1);
  });

  /* ---------- Visualizador de fotos ---------- */
  function todasAsFotos() {
    const f = estado.form;
    return ((f.imovel && f.imovel.Fotos) || []).map(foto => ({ nome: foto.nome, url: foto.url }))
      .concat(f.fotosNovas.map(foto => ({ nome: foto.arquivo.name, previa: foto.previa })));
  }

  async function verFoto(n) {
    const fotos = todasAsFotos();
    if (!fotos.length) return;
    n = (n + fotos.length) % fotos.length;
    estado.visor = { n };
    const foto = fotos[n];
    const navegacao = fotos.length > 1 ? `
      <button type="button" class="visor-seta esquerda" onclick="verFoto(${n - 1})" aria-label="Foto anterior">‹</button>
      <button type="button" class="visor-seta direita" onclick="verFoto(${n + 1})" aria-label="Próxima foto">›</button>` : '';
    abrirJanela(`Foto ${n + 1} de ${fotos.length}`, `
      <div class="visor"><div class="carregando" id="visor-foto"><div class="girando"></div>Abrindo a foto…</div>${navegacao}</div>
      <p class="suave pequeno visor-nome">${esc(nomeLegivel(foto.nome))}</p>`, 'janela--larga');
    estado.aoFecharJanela = () => { estado.visor = null; };
    try {
      const endereco = foto.previa || await enderecoDaFoto(foto.url);
      const lugar = document.getElementById('visor-foto');
      if (lugar && estado.visor && estado.visor.n === n) lugar.outerHTML = `<img class="visor-img" src="${endereco}" alt="${esc(nomeLegivel(foto.nome))}">`;
      if (foto.url) { const quadro = document.querySelector(`#anexos [data-miniatura="${CSS.escape(foto.url)}"]`); if (quadro) desenharAnexos(); }
    } catch (erro) {
      const lugar = document.getElementById('visor-foto');
      if (lugar) lugar.innerHTML = `<p>${esc(erro.message || erro)}</p>`;
    }
  }

  /* ---------- Visualizador do contrato (PDF) ----------
   * As páginas são desenhadas dentro do portal (no tablet, abrir o PDF em outra aba às vezes só baixa). */
  const PAGINAS_MAXIMAS = 40;

  async function verContrato() {
    const f = estado.form;
    const nome = f.contratoNovo ? f.contratoNovo.name : (f.imovel.ContratoNome || 'contrato.pdf');
    abrirJanela(esc(nomeLegivel(nome)), `<div class="paginas-pdf" id="paginas-pdf"><div class="carregando"><div class="girando"></div>Abrindo o contrato…</div></div>`,
      'janela--larga', `<button type="button" class="pr-btn pr-btn--sec" onclick="baixarContrato()">Baixar o PDF</button>
      <button type="button" class="pr-btn pr-btn--pri" onclick="fecharJanela()">Fechar</button>`);
    let ativo = true;
    estado.aoFecharJanela = () => { ativo = false; };
    try {
      let bytes;
      if (f.contratoNovo) bytes = new Uint8Array(await f.contratoNovo.arrayBuffer());
      else {
        const a = await chamar('baixarArquivo', f.imovel.ContratoUrl, auth());
        bytes = new Uint8Array(await base64ParaBlob(a.base64, a.tipo).arrayBuffer());
      }
      await carregarScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      const pdf = await pdfjsLib.getDocument({ data: bytes }).promise;
      const area = document.getElementById('paginas-pdf');
      if (!ativo || !area) return;
      area.innerHTML = '';
      const total = Math.min(pdf.numPages, PAGINAS_MAXIMAS);
      for (let p = 1; p <= total && ativo; p++) {
        const pagina = await pdf.getPage(p);
        const base = pagina.getViewport({ scale: 1 });
        const largura = Math.min(area.clientWidth || 800, 900);
        const vp = pagina.getViewport({ scale: largura / base.width * Math.min(window.devicePixelRatio || 1, 2) });
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(vp.width); canvas.height = Math.round(vp.height);
        canvas.setAttribute('aria-label', `Página ${p} de ${pdf.numPages}`);
        area.appendChild(canvas);
        await pagina.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
      }
      if (ativo && pdf.numPages > PAGINAS_MAXIMAS) {
        area.insertAdjacentHTML('beforeend', `<p class="suave">Mostrando as ${PAGINAS_MAXIMAS} primeiras de ${pdf.numPages} páginas. Baixe o PDF para ver tudo.</p>`);
      }
    } catch (erro) {
      const area = document.getElementById('paginas-pdf');
      if (area) area.innerHTML = `<p>Não deu para mostrar o contrato aqui (${esc(erro.message || erro)}). Use "Baixar o PDF".</p>`;
    }
  }

  async function baixarContrato() {
    const f = estado.form;
    if (f.contratoNovo) {
      const endereco = URL.createObjectURL(f.contratoNovo);
      const link = document.createElement('a');
      link.href = endereco; link.download = f.contratoNovo.name;
      document.body.appendChild(link); link.click(); link.remove();
      setTimeout(() => URL.revokeObjectURL(endereco), 60000);
      return;
    }
    abrirAnexo({ preventDefault() {} }, f.imovel.ContratoUrl);
  }

  /* ---------- Escolher e enquadrar a foto de capa ----------
   * Abre a foto com um círculo por cima: arrastar move a foto, o controle aproxima/afasta.
   * O que fica dentro do círculo vira a thumbnail do avatar (crop com pan e zoom). */
  const LADO_MINIATURA = 200; // nítida até o avatar grande do título (96 px em telas de alta definição)

  async function escolherCapa(tipo, n) {
    const f = estado.form;
    const escolha = tipo === 'nova' ? { foto: f.fotosNovas[n] } : { url: f.imovel.Fotos[n].url };
    const jaEra = !!f.capa && (escolha.foto ? f.capa.foto === escolha.foto : f.capa.url === escolha.url);
    abrirJanela('Enquadrar a foto de perfil', `
      <p class="suave pequeno">Arraste a foto para posicionar e use o controle para aproximar. O que ficar dentro do círculo vira a foto de perfil do imóvel.</p>
      <div class="recorte" id="recorte"><div class="carregando"><div class="girando"></div>Abrindo a foto…</div></div>
      <div class="pr-field"><label for="recorte-zoom">Aproximar</label>
        <input id="recorte-zoom" type="range" min="1" max="4" step="0.01" value="1" disabled></div>`, '', `
        ${jaEra ? '<button type="button" class="pr-btn pr-btn--perigo" onclick="confirmarCapa(\'tirar\')" style="margin-right:auto">Tirar foto de perfil</button>' : ''}
        <button type="button" class="pr-btn pr-btn--sec" onclick="fecharJanela()">Cancelar</button>
        <button type="button" class="pr-btn pr-btn--pri" id="btn-usar-recorte" onclick="confirmarCapa('usar')" disabled>Salvar foto de perfil</button>`);
    estado.recorte = { escolha };
    estado.aoFecharJanela = () => { estado.recorte = null; };
    try {
      const endereco = escolha.foto ? escolha.foto.previa : await enderecoDaFoto(escolha.url);
      const img = new Image();
      img.src = endereco;
      await img.decode();
      if (!estado.recorte || estado.recorte.escolha !== escolha) return;
      montarRecorte(img);
    } catch (erro) {
      const lugar = document.getElementById('recorte');
      if (lugar) lugar.innerHTML = `<p>Não deu para abrir a foto (${esc(erro.message || erro)}).</p>`;
    }
  }

  function montarRecorte(img) {
    const r = estado.recorte;
    const area = document.getElementById('recorte');
    area.innerHTML = '<canvas aria-label="Foto para enquadrar"></canvas><div class="recorte-circulo" aria-hidden="true"></div>';
    const canvas = area.querySelector('canvas');
    const lado = area.clientWidth || 300;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = canvas.height = Math.round(lado * dpr);
    Object.assign(r, { img, lado, dpr, canvas, zoom: 1, x: 0, y: 0,
      cobrir: lado / Math.min(img.naturalWidth, img.naturalHeight) }); // escala em que a foto cobre o quadro todo
    const zoom = document.getElementById('recorte-zoom');
    zoom.disabled = false;
    zoom.oninput = () => { r.zoom = Number(zoom.value); desenharRecorte(); };
    document.getElementById('btn-usar-recorte').disabled = false;
    // Arrastar com o dedo ou o mouse
    let inicio = null;
    canvas.onpointerdown = e => { canvas.setPointerCapture(e.pointerId); inicio = { px: e.clientX, py: e.clientY, x: r.x, y: r.y }; };
    canvas.onpointermove = e => {
      if (!inicio) return;
      r.x = inicio.x + (e.clientX - inicio.px);
      r.y = inicio.y + (e.clientY - inicio.py);
      desenharRecorte();
    };
    canvas.onpointerup = canvas.onpointercancel = () => { inicio = null; };
    // A roda do mouse também aproxima (no tablet, use o controle "Aproximar")
    canvas.onwheel = e => {
      e.preventDefault();
      r.zoom = Math.min(4, Math.max(1, r.zoom * (e.deltaY < 0 ? 1.08 : 0.92)));
      zoom.value = r.zoom; desenharRecorte();
    };
    desenharRecorte();
  }

  // Desenha a foto na posição e no zoom atuais (sem deixar sobrar borda vazia)
  function desenharRecorte(destino, ladoDestino) {
    const r = estado.recorte;
    const escala = r.cobrir * r.zoom;
    const w = r.img.naturalWidth * escala, h = r.img.naturalHeight * escala;
    r.x = Math.max(-(w - r.lado) / 2, Math.min((w - r.lado) / 2, r.x));
    r.y = Math.max(-(h - r.lado) / 2, Math.min((h - r.lado) / 2, r.y));
    const canvas = destino || r.canvas;
    const fator = (ladoDestino || r.lado * r.dpr) / r.lado;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(r.img, ((r.lado - w) / 2 + r.x) * fator, ((r.lado - h) / 2 + r.y) * fator, w * fator, h * fator);
  }

  async function confirmarCapa(acao) {
    const f = estado.form, r = estado.recorte;
    let escolha = null;
    if (acao !== 'tirar') {
      if (!r || !r.img) return;
      const saida = document.createElement('canvas');
      saida.width = saida.height = LADO_MINIATURA;
      desenharRecorte(saida, LADO_MINIATURA);
      escolha = { ...r.escolha, miniatura: saida.toDataURL('image/jpeg', 0.8) };
    }
    const botao = document.getElementById('btn-usar-recorte');
    // Foto que já está no portal (ou tirar a capa): grava agora, sem depender do Salvar do formulário
    const gravarAgora = f.imovel && f.imovel.ID_Imovel && (escolha ? !escolha.foto : !!f.imovel.CapaUrl);
    if (gravarAgora) {
      document.querySelectorAll('.janela-rodape button').forEach(b => { b.disabled = true; });
      if (botao) botao.textContent = 'Salvando…';
      try {
        f.imovel = await chamar('definirCapa', f.imovel.ID_Imovel, escolha ? escolha.url : '', escolha ? escolha.miniatura : '', auth());
        f.capa = f.imovel.CapaUrl ? { url: f.imovel.CapaUrl } : null;
      } catch (erro) {
        document.querySelectorAll('.janela-rodape button').forEach(b => { b.disabled = false; });
        if (botao) botao.textContent = 'Salvar foto de perfil';
        return mostrarErro(erro);
      }
    } else {
      f.capa = escolha; // foto nova: a capa vai junto quando as fotos forem enviadas
    }
    fecharJanela();
    desenharAnexos();
    const titulo = document.getElementById('titulo-capa');
    if (titulo && f.imovel) {
      const atual = titulo.querySelector('.capa');
      const html = avatarImovel(document.getElementById('f-Nome').value, gravarAgora ? f.imovel.Capa : (f.capa ? f.capa.miniatura : ''), true);
      if (atual) atual.outerHTML = html; else titulo.insertAdjacentHTML('afterbegin', html);
    }
    mostrarMensagem(gravarAgora ? (escolha ? 'Foto de perfil salva!' : 'Foto de perfil tirada.')
      : 'A foto de perfil será salva junto com as fotos quando você tocar em Salvar.');
  }

  // Grava a capa escolhida (depois que as fotos novas já foram enviadas e têm endereço)
  async function salvarCapa(id) {
    const f = estado.form;
    const antes = (f.imovel && f.imovel.CapaUrl) || '';
    if (!f.capa) {
      if (antes) f.imovel = await chamar('definirCapa', id, '', '', auth());
      return;
    }
    if (!f.capa.miniatura) return; // capa que já estava salva, sem mudança
    const url = f.capa.foto ? f.capa.foto.url : f.capa.url;
    if (!url) return;
    f.imovel = await chamar('definirCapa', id, url, f.capa.miniatura, auth());
  }

  function escolherContrato(campo) {
    const arquivo = campo.files[0];
    campo.value = '';
    if (!arquivo) return;
    if (arquivo.type !== 'application/pdf') return mostrarMensagem('O contrato precisa ser um arquivo PDF.', 'erro');
    estado.form.contratoNovo = arquivo;
    estado.form.renomeando = false;
    desenharAnexos();
  }

  async function tirarFotoSalva(url) {
    if (!confirm('Remover esta foto? Ela vai para a lixeira do Google Drive.')) return;
    try {
      estado.form.imovel = await chamar('removerFoto', estado.form.imovel.ID_Imovel, url, auth());
      if (estado.form.capa && estado.form.capa.url === url) estado.form.capa = null;
      desenharAnexos();
      mostrarMensagem('Foto removida.');
    } catch (erro) { mostrarErro(erro); }
  }

  // Renomear: contrato novo muda só aqui (vai com o nome novo); contrato salvo muda no portal e no Drive
  async function salvarNomeContrato() {
    const f = estado.form;
    const nome = document.getElementById('novo-nome-contrato').value.replace(/[\\/:*?"<>|\uFFFD]/g, '').trim().replace(/\.pdf$/i, '');
    if (!nome) return mostrarMensagem('Digite o nome do contrato.', 'erro');
    if (f.contratoNovo) {
      f.contratoNovo = new File([f.contratoNovo], nome + '.pdf', { type: 'application/pdf' });
    } else {
      const botao = document.getElementById('btn-nome-contrato');
      botao.disabled = true; botao.textContent = 'Salvando…';
      try { f.imovel = await chamar('renomearContrato', f.imovel.ID_Imovel, nome, auth()); }
      catch (erro) { botao.disabled = false; botao.textContent = 'Salvar nome'; return mostrarErro(erro); }
      mostrarMensagem('Nome do contrato salvo!');
    }
    f.renomeando = false;
    desenharAnexos();
  }

  async function tirarContratoSalvo() {
    if (!confirm('Remover o contrato? Ele vai para a lixeira do Google Drive.')) return;
    try {
      estado.form.imovel = await chamar('removerContrato', estado.form.imovel.ID_Imovel, auth());
      desenharAnexos();
      mostrarMensagem('Contrato removido.');
    } catch (erro) { mostrarErro(erro); }
  }

  // As fotos ficam privadas no Drive: as miniaturas são baixadas uma por vez pelo servidor
  async function carregarMiniaturas() {
    if (estado.baixandoMiniaturas) return;
    estado.baixandoMiniaturas = true;
    try {
      let lugar;
      while ((lugar = document.querySelector('#anexos [data-miniatura]:not([data-tentou])'))) {
        const url = lugar.dataset.miniatura;
        lugar.dataset.tentou = '1';
        try {
          const endereco = await enderecoDaFoto(url);
          const atual = document.querySelector(`#anexos [data-miniatura="${CSS.escape(url)}"]`);
          if (atual) atual.outerHTML = `<img src="${endereco}" alt="" onclick="${atual.getAttribute('onclick')}">`;
        } catch (e) { /* fica o quadradinho "FOTO" */ }
      }
    } finally { estado.baixandoMiniaturas = false; }
  }


  async function salvarFormulario() {
    const f = estado.form;
    const dados = lerFormulario('form-imovel');
    if (!dados.Nome) return mostrarMensagem('Informe o nome do imóvel.', 'erro');
    if (dados.DataVigente && dados.DataPrazo && dados.DataPrazo < dados.DataVigente) {
      return mostrarMensagem('A data prazo não pode ser antes da data vigente.', 'erro');
    }
    if (dados.Cobrar === 'Sim' && !dados.InicioCobranca) return mostrarMensagem('Informe o dia em que a cobrança começa.', 'erro');
    if (dados.Cobrar === 'Sim' && Number.isNaN(lerValor(dados.ValorAluguel))) return mostrarMensagem('Valor do aluguel inválido. Use, por exemplo, 1.500,00.', 'erro');
    const botao = document.getElementById('btn-salvar');
    const textoBotao = botao.textContent;
    botao.disabled = true; botao.textContent = 'Salvando…';
    let id = f.imovel && f.imovel.ID_Imovel;
    try {
      const r = await chamar('salvarImovel', id || '', dados, auth());
      id = r.imovel.ID_Imovel;
      f.imovel = r.imovel;
      // Depois de salvar os dados, envia os anexos um por vez
      const total = f.fotosNovas.length;
      while (f.fotosNovas.length) {
        const foto = f.fotosNovas[0];
        mostrarAvisoFixo(`Enviando foto ${total - f.fotosNovas.length + 1} de ${total}…`);
        f.imovel = await chamar('anexarFoto', id, await lerArquivo(foto.arquivo), auth());
        foto.url = f.imovel.Fotos[f.imovel.Fotos.length - 1].url; // endereço no Drive, para a capa
        if (!(f.capa && f.capa.foto === foto)) URL.revokeObjectURL(foto.previa);
        f.fotosNovas.shift();
      }
      if (f.contratoNovo) {
        mostrarAvisoFixo('Enviando o contrato…');
        f.imovel = await chamar('anexarContrato', id, await lerArquivo(f.contratoNovo), auth());
        f.contratoNovo = null;
      }
      await salvarCapa(id);
      document.getElementById('progresso-envio')?.remove();
      if (r.avisoAgenda) mostrarMensagem(r.avisoAgenda, 'erro'); else mostrarMensagem('Imóvel salvo!');
      atualizarAvisos();
      navegar('#/imoveis');
    } catch (erro) {
      document.getElementById('progresso-envio')?.remove();
      botao.disabled = false; botao.textContent = textoBotao;
      // Os dados já foram salvos, mas um anexo falhou: fica na tela para tentar de novo
      if (id) {
        mostrarMensagem('Os dados foram salvos, mas um anexo não foi enviado: ' + (erro.message || erro) + ' Toque em Salvar para tentar de novo.', 'erro');
        if (location.hash !== '#/imovel/' + id) history.replaceState(null, '', '#/imovel/' + id);
        desenharAnexos();
      } else {
        mostrarErro(erro);
      }
    }
  }

  async function excluirImovelAtual() {
    const i = estado.form.imovel;
    if (!confirm(`Excluir "${i.Nome}"? Os eventos da agenda são apagados, e as fotos e o contrato vão para a lixeira do Google Drive.`)) return;
    try {
      await chamar('excluirImovel', i.ID_Imovel, auth());
      mostrarMensagem('Imóvel excluído.');
      atualizarAvisos();
      navegar('#/imoveis');
    } catch (erro) { mostrarErro(erro); }
  }

  /* =========================================================
   * Arquivos: reduzir, enviar em pedaços e abrir
   * ========================================================= */
  const TAMANHO_ORIGINAL_MB = 100;
  const TAMANHO_MAXIMO_MB = 50;     // limite do Google para um arquivo
  const TAMANHO_PEDACO = 1500000;   // caracteres de base64 por pedaço (múltiplo de 4)
  const LADO_MAXIMO_FOTO = 1600;

  async function lerArquivo(arquivo) {
    if (arquivo.size > TAMANHO_ORIGINAL_MB * 1024 * 1024) {
      throw new Error(`O arquivo ${arquivo.name} passa de ${TAMANHO_ORIGINAL_MB} MB. Envie um arquivo menor.`);
    }
    arquivo = await reduzirArquivo(arquivo);
    if (arquivo.size > TAMANHO_MAXIMO_MB * 1024 * 1024) {
      throw new Error(`Mesmo reduzido, o arquivo passa de ${TAMANHO_MAXIMO_MB} MB. Envie um arquivo menor.`);
    }
    const base64 = await new Promise((resolve, reject) => {
      const leitor = new FileReader();
      leitor.onload = () => resolve(leitor.result.split(',')[1]);
      leitor.onerror = () => reject(new Error('Não foi possível ler o arquivo.'));
      leitor.readAsDataURL(arquivo);
    });
    const dados = { nome: arquivo.name, tipo: arquivo.type || 'application/octet-stream' };
    if (base64.length <= TAMANHO_PEDACO || !window.API_URL) return { ...dados, base64 };

    // Arquivo grande: vai em pedaços, porque o Google falha com pedidos muito grandes
    const envio = Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
    const partes = Math.ceil(base64.length / TAMANHO_PEDACO);
    for (let i = 0; i < partes; i++) {
      mostrarAvisoFixo(`Enviando ${arquivo.name}… ${Math.round(i / partes * 100)}%`);
      await chamar('enviarParteArquivo', envio, i, base64.slice(i * TAMANHO_PEDACO, (i + 1) * TAMANHO_PEDACO), auth());
    }
    mostrarAvisoFixo('Salvando no Google Drive…');
    return { ...dados, envio, partes };
  }

  /* Fotos: no máximo 1600 px no lado maior, em JPEG (uma foto de celular de 3–5 MB vira uns 300 KB).
   * PDFs escaneados: cada página vira uma imagem mais leve. PDFs com texto, folhas grandes
   * e PDFs com assinatura digital ficam como estão. Se não ficar menor, vai o original. */
  async function reduzirArquivo(arquivo) {
    try {
      if (/^image\/(jpeg|png|webp)$/i.test(arquivo.type) && arquivo.size > 400 * 1024) return await reduzirImagem(arquivo);
      if (arquivo.type === 'application/pdf' && arquivo.size > 1.5 * 1024 * 1024) return await reduzirPdf(arquivo);
    } catch (erro) { console.warn('Não foi possível reduzir o arquivo; vai o original.', erro); }
    return arquivo;
  }

  async function reduzirImagem(arquivo) {
    const endereco = URL.createObjectURL(arquivo);
    try {
      const img = new Image();
      img.src = endereco;
      await img.decode(); // o navegador já aplica a rotação da câmera
      const escala = Math.min(1, LADO_MAXIMO_FOTO / Math.max(img.naturalWidth, img.naturalHeight));
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(img.naturalWidth * escala);
      canvas.height = Math.round(img.naturalHeight * escala);
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.78));
      if (!blob || blob.size >= arquivo.size) return arquivo;
      return new File([blob], arquivo.name.replace(/\.\w+$/, '') + '.jpg', { type: 'image/jpeg' });
    } finally { URL.revokeObjectURL(endereco); }
  }

  async function reduzirPdf(arquivo) {
    const bytes = new Uint8Array(await arquivo.arrayBuffer());
    // Assinatura digital (gov.br, certificado, Clicksign…): mexer no arquivo invalidaria a assinatura
    const amostra = new TextDecoder('latin1').decode(bytes);
    if (/\/ByteRange|\/Type\s*\/Sig\b/.test(amostra)) return arquivo;

    mostrarAvisoFixo('Reduzindo o PDF…');
    await carregarScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
    await carregarScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const pdf = await pdfjsLib.getDocument({ data: bytes }).promise;
    if (pdf.numPages > 60) return arquivo;

    let comTexto = 0;
    for (let i = 1; i <= pdf.numPages; i++) {
      const pagina = await pdf.getPage(i);
      const v = pagina.getViewport({ scale: 1 });
      if (Math.max(v.width, v.height) > 1250) return arquivo;
      const texto = await pagina.getTextContent();
      if (texto.items.map(t => t.str).join('').trim().length > 80) comTexto++;
    }
    if (comTexto > pdf.numPages / 2) return arquivo;

    let doc;
    const canvas = document.createElement('canvas');
    for (let i = 1; i <= pdf.numPages; i++) {
      mostrarAvisoFixo(`Reduzindo o PDF… página ${i} de ${pdf.numPages}`);
      const pagina = await pdf.getPage(i);
      const base = pagina.getViewport({ scale: 1 });
      const vp = pagina.getViewport({ scale: Math.min(2.2, LADO_MAXIMO_FOTO / Math.max(base.width, base.height)) });
      canvas.width = Math.round(vp.width); canvas.height = Math.round(vp.height);
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
      await pagina.render({ canvasContext: ctx, viewport: vp }).promise;
      const jpg = canvas.toDataURL('image/jpeg', 0.72);
      const formato = [base.width, base.height];
      const orientacao = base.width > base.height ? 'l' : 'p';
      if (!doc) doc = new jspdf.jsPDF({ orientation: orientacao, unit: 'pt', format: formato });
      else doc.addPage(formato, orientacao);
      doc.addImage(jpg, 'JPEG', 0, 0, base.width, base.height);
    }
    const blob = doc.output('blob');
    return blob.size < arquivo.size * 0.8 ? new File([blob], arquivo.name, { type: 'application/pdf' }) : arquivo;
  }

  const scriptsCarregados = {};
  function carregarScript(src) {
    if (!scriptsCarregados[src]) {
      scriptsCarregados[src] = new Promise((resolve, reject) => {
        const tag = document.createElement('script');
        tag.src = src;
        tag.onload = resolve;
        tag.onerror = () => { delete scriptsCarregados[src]; reject(new Error('Sem internet para carregar ' + src)); };
        document.head.appendChild(tag);
      });
    }
    return scriptsCarregados[src];
  }

  function base64ParaBlob(base64, tipo) {
    const binario = atob(base64);
    const bytes = new Uint8Array(binario.length);
    for (let i = 0; i < binario.length; i++) bytes[i] = binario.charCodeAt(i);
    return new Blob([bytes], { type: tipo });
  }

  // Os arquivos ficam privados no Drive: o portal busca pelo servidor e abre numa nova aba
  async function abrirAnexo(evento, url) {
    evento.preventDefault();
    const janela = window.open('', '_blank');
    if (janela) janela.document.write('<p style="font-family:sans-serif;padding:24px;color:#555">Abrindo o arquivo…</p>');
    try {
      const a = await chamar('baixarArquivo', url, auth());
      const endereco = URL.createObjectURL(base64ParaBlob(a.base64, a.tipo));
      if (janela && /^(application\/pdf|image\/)/.test(a.tipo)) {
        janela.location.href = endereco;
      } else {
        if (janela) janela.close();
        const link = document.createElement('a');
        link.href = endereco; link.download = a.nome;
        document.body.appendChild(link); link.click(); link.remove();
      }
      setTimeout(() => URL.revokeObjectURL(endereco), 120000);
    } catch (erro) {
      if (janela) janela.close();
      mostrarErro(erro);
    }
    return false;
  }

  /* =========================================================
   * Usuários (só administrador)
   * ========================================================= */
  async function telaUsuarios() {
    carregando('Carregando os usuários…');
    try { estado.admin = await chamar('listarUsuariosAdmin', auth()); } catch (erro) { return telaErro(erro, '#/'); }
    if (paginaAtual() !== 'usuarios') return;
    const us = estado.admin.usuarios;
    estado.pendentes = us.filter(u => u.Situacao === 'Pendente').length;
    desenharTopo('usuarios');
    const pendentes = us.filter(u => u.Situacao === 'Pendente');
    const outros = us.filter(u => u.Situacao !== 'Pendente');
    const linha = u => `
      <div class="usuario-linha">
        <div><b>${esc(u.Nome)}</b> ${u.Situacao !== 'Ativo' ? `<span class="etiqueta">${esc(u.Situacao)}</span>` : ''}
          <div class="suave pequeno">${esc(u.Email)} · ${esc(u.Nivel)}${u.UltimoAcesso ? ' · último acesso ' + dataBR(u.UltimoAcesso) : ''}</div></div>
        <div class="acoes" style="flex:none">
          ${u.Situacao === 'Pendente' ? `
            <button class="pr-btn pr-btn--pri pr-btn--pequeno" onclick="decidirCadastro('${esc(u.ID_Usuario)}', 'Ativo')">Aprovar</button>
            <button class="pr-btn pr-btn--perigo pr-btn--pequeno" onclick="decidirCadastro('${esc(u.ID_Usuario)}', 'Recusado')">Recusar</button>` : ''}
          <a class="pr-btn pr-btn--sec pr-btn--pequeno" href="#/usuario/${esc(u.ID_Usuario)}">Editar</a>
        </div>
      </div>`;
    tela(`
      <div class="titulo-pagina"><div><span class="rotulo">${us.length} ${us.length === 1 ? 'pessoa' : 'pessoas'}</span><h1>Usuários</h1></div></div>
      ${pendentes.length ? `<section class="painel"><h2>Pedidos de acesso</h2>
        <p class="suave pequeno">Quem for aprovado entra como Equipe: vê, inclui e edita imóveis. Só o Administrador exclui imóveis e cuida dos usuários.</p>
        <div>${pendentes.map(linha).join('')}</div></section>` : ''}
      <section class="painel"><h2>Equipe</h2><div>${outros.map(linha).join('')}</div></section>`, true);
  }

  async function decidirCadastro(id, situacao) {
    const u = estado.admin.usuarios.find(x => x.ID_Usuario === id);
    try {
      await chamar('salvarUsuario', id, { Nome: u.Nome, Telefone: u.Telefone, Nivel: u.Nivel || 'Equipe', Situacao: situacao }, auth());
      mostrarMensagem(situacao === 'Ativo' ? `${u.Nome} pode entrar no portal.` : 'Pedido recusado.');
      telaUsuarios();
    } catch (erro) { mostrarErro(erro); }
  }

  async function telaEditarUsuario(id) {
    if (!estado.admin) {
      carregando();
      try { estado.admin = await chamar('listarUsuariosAdmin', auth()); } catch (erro) { return telaErro(erro, '#/usuarios'); }
    }
    const u = estado.admin.usuarios.find(x => x.ID_Usuario === id);
    if (!u) return telaErro(new Error('Usuário não encontrado.'), '#/usuarios');
    const opcoes = (lista, atual) => lista.map(o => `<option${o === atual ? ' selected' : ''}>${esc(o)}</option>`).join('');
    tela(`
      <div class="titulo-pagina"><div><span class="rotulo"><a href="#/usuarios" style="color:inherit">Usuários</a> › Editar</span><h1>${esc(u.Nome)}</h1>
        <p class="suave">${esc(u.Email)}</p></div></div>
      <form id="form-usuario" class="painel" onsubmit="event.preventDefault(); salvarUsuarioAdmin('${esc(id)}')">
        <div class="grade">
          <div class="pr-field"><label for="u-Nome">Nome</label><input id="u-Nome" name="Nome" required value="${esc(u.Nome)}"></div>
          <div class="pr-field"><label for="u-Telefone">Telefone</label><input id="u-Telefone" name="Telefone" type="tel"${mascara('telefone')} value="${esc(u.Telefone || '')}"></div>
          <div class="pr-field"><label for="u-Nivel">Nível de acesso</label><select id="u-Nivel" name="Nivel">${opcoes(estado.admin.niveis, u.Nivel)}</select>
            <small>Equipe vê, inclui e edita imóveis. Administrador também exclui imóveis e cuida dos usuários.</small></div>
          <div class="pr-field"><label for="u-Situacao">Situação</label><select id="u-Situacao" name="Situacao">${opcoes(estado.admin.situacoes, u.Situacao)}</select>
            <small>Inativo: a pessoa não consegue mais entrar.</small></div>
          <div class="pr-field"><label for="u-NovaSenha">Nova senha</label><input id="u-NovaSenha" name="NovaSenha" type="text" autocomplete="off" minlength="6">
            <small>Só para quem esqueceu a senha. Deixe em branco para não mudar.</small></div>
        </div>
        <div class="acoes fim"><a href="#/usuarios" class="pr-btn pr-btn--sec">Cancelar</a><button class="pr-btn pr-btn--pri" id="btn-salvar-usuario">Salvar</button></div>
      </form>`, true);
  }

  async function salvarUsuarioAdmin(id) {
    const botao = document.getElementById('btn-salvar-usuario');
    botao.disabled = true; botao.textContent = 'Salvando…';
    try {
      estado.admin = await chamar('salvarUsuario', id, lerFormulario('form-usuario'), auth());
      mostrarMensagem('Usuário salvo!');
      navegar('#/usuarios');
    } catch (erro) {
      mostrarErro(erro);
      botao.disabled = false; botao.textContent = 'Salvar';
    }
  }

  /* =========================================================
   * App instalável (PWA): ícone na tela inicial, abre sem a barra do navegador
   * ========================================================= */
  let pedidoInstalar = null;
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); pedidoInstalar = e; });
  window.addEventListener('appinstalled', () => { pedidoInstalar = null; mostrarMensagem('App instalado! Procure o ícone "Locação" na tela inicial.'); });

  function appInstalado() {
    return !!(window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
  }

  // O Samsung Internet empacota o PWA num APK antigo, que o Google Play Protect bloqueia ("App de risco").
  // Por isso, nele o portal não oferece a instalação e indica o Chrome.
  function ehSamsungInternet() {
    return /SamsungBrowser/i.test(navigator.userAgent);
  }

  async function instalarApp() {
    fecharFlutuantes();
    if (pedidoInstalar && !ehSamsungInternet()) {
      pedidoInstalar.prompt(); // o navegador mostra a pergunta "Instalar app?"
      await pedidoInstalar.userChoice;
      pedidoInstalar = null;
      return;
    }
    const link = location.origin + location.pathname;
    abrirJanela('Instalar o app', `
      ${ehSamsungInternet() ? `<div class="pr-alert pr-alert--atencao"><span class="pr-alert__ic">!</span><div><b>Use o Chrome para instalar</b>
        Instalado pelo Samsung Internet, o app é bloqueado pelo Google Play Protect ("App de risco bloqueado").
        Pelo Chrome, a instalação é aceita normalmente.</div></div>` : ''}
      <p>Assim o portal ganha um ícone na tela inicial e abre direto, sem a barra do navegador.</p>
      <div class="painel"><h3>Android</h3>
        <p>Abra o portal no <b>Chrome</b>, toque nos <b>três pontinhos ⋮</b> no canto de cima e depois em <b>Instalar app</b> (ou <b>Adicionar à tela inicial</b>).</p>
        <div class="acoes"><button type="button" class="pr-btn pr-btn--sec pr-btn--pequeno" onclick="copiarLink('${esc(link)}')">Copiar o link do portal</button>
          <span class="suave pequeno">e cole na barra de endereço do Chrome</span></div></div>
      <div class="painel"><h3>iPhone ou iPad</h3>
        <p>Abra o portal no <b>Safari</b>, toque em <b>Compartilhar</b> (o quadrado com a seta para cima) e depois em <b>Adicionar à Tela de Início</b>.</p></div>`,
      '', '<button type="button" class="pr-btn pr-btn--pri" onclick="fecharJanela()">Entendi</button>');
  }

  async function copiarLink(link) {
    try { await navigator.clipboard.writeText(link); mostrarMensagem('Link copiado! Agora cole no Chrome.'); }
    catch (e) { prompt('Copie o link do portal:', link); }
  }

  // O ajudante só funciona no site do GitHub (no endereço do Google não dá para instalar)
  if (window.API_URL && 'serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }

  iniciar();
</script>
